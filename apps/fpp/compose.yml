---
# Free Planning Poker — single-tenant stack: MariaDB + fpp-server + fpp-analytics.
#
# This compose lives in apps/fpp/ on purpose: MariaDB is exposed on a public port
# so Vercel can reach it. That breaks the repo-wide "no inbound ports" invariant,
# so the deviation is quarantined here rather than poisoning compose.infra.yml.
# See ../../AGENTS.md → Security Invariants for the documented exception.
#
# fpp-server and fpp-analytics are deployed via RollHook from the
# jkrumm/free-planning-poker repo (push to master). fpp-analytics-updater runs
# the same image as fpp-analytics but in a sleep-loop sidecar and is bounced
# manually when its image needs refreshing (no zero-downtime requirement —
# 10-min polling cron, brief restart is fine).
#
# Bootstrap order on a fresh server:
#   1. make networking-up           (Traefik gets *.free-planning-poker.com cert via DNS-01)
#   2. make fpp-cert-sync           (extracts that wildcard cert into apps/fpp/certs/)
#   3. make fpp-up                  (MariaDB starts, refuses to start without certs)
#   4. make fpp-mariadb-setup       (provisions fpp user + grants)
#   5. Manual one-shot: docker login rollhook.jkrumm.com, build+push initial
#      fpp-server / fpp-analytics images so the registry has something to pull.

networks:
  mariadb-net:
    external: true
  proxy:
    external: true
  # Shared with compose.infra.yml — fpp-server uses Valkey for room state
  # snapshots so an in-memory room survives a RollHook rolling restart.
  valkey-net:
    external: true
  # Shared with compose.monitoring.yml — fpp-server and fpp-analytics emit
  # OTLP traces + logs to clickstack:4319 (unauthed receiver, docker-only).
  monitoring-net:
    external: true

volumes:
  mariadb-data:
  fpp-analytics-data:

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    environment:
      MARIADB_DATABASE: ${MARIADB_DB}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: >
      --require-secure-transport=ON
      --ssl-cert=/etc/mysql/certs/cert.pem
      --ssl-key=/etc/mysql/certs/key.pem
      --max-connections=200
      --innodb-buffer-pool-size=1G
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    # Public exposure for Vercel. Cloudflare Tunnel can't proxy raw MySQL protocol
    # (TCP origins require cloudflared/WARP client; Spectrum is Enterprise-only).
    # Mitigations: TLS required (--require-secure-transport), schema-scoped fpp user,
    # fail2ban on auth failures, no remote root. DNS-only A record db.free-planning-poker.com.
    ports:
      - "33306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./certs:/etc/mysql/certs:ro
    networks:
      - mariadb-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Watchtower: excluded from auto-updates — MariaDB is stateful, update manually.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    # journald (not json-file) so fail2ban can watch auth failures via systemd backend.
    # Tag 'mariadb' is matched by /etc/fail2ban/jail.d/mariadb.conf.
    logging:
      driver: journald
      options:
        tag: mariadb

  # ---------------------------------------------------------------------------
  # fpp-server — Bun + Elysia WebSocket server. Public via Cloudflare Tunnel +
  # Traefik. Deployed via RollHook on push to jkrumm/free-planning-poker:master.
  # ---------------------------------------------------------------------------
  fpp-server:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-server:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      LOG_LEVEL: INFO
      TRPC_URL: https://free-planning-poker.com/api/trpc
      FPP_SERVER_SECRET: ${FPP_SERVER_SECRET}
      # OTLP HTTP receiver on the ClickStack monitoring-net bridge. No auth
      # required — trust boundary is docker network membership.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-server
      # Valkey for room state snapshots — survives RollHook rolling restart.
      # No password (Valkey is on an internal-only Docker network). Unsetting
      # this env var degrades gracefully to in-memory-only behavior.
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fpp-server.rule=Host(`server.free-planning-poker.com`)"
      - "traefik.http.routers.fpp-server.entrypoints=websecure"
      - "traefik.http.routers.fpp-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.fpp-server.loadbalancer.server.port=3003"
      - "traefik.http.routers.fpp-server.middlewares=rate-limit@file,security-headers@file"
      # Active health check — Traefik stops routing to the draining instance the
      # moment SIGTERM flips /health to 503 (see fpp-server src/index.ts).
      - "traefik.http.services.fpp-server.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.fpp-server.loadbalancer.healthcheck.interval=5s"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo can trigger deploys.
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
    networks:
      - proxy
      - valkey-net
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # fpp-analytics — FastAPI read-only analytics API. Reads parquet snapshots
  # written by fpp-analytics-updater. Public via Traefik. RollHook-managed.
  # ---------------------------------------------------------------------------
  fpp-analytics:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-analytics:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
      ANALYTICS_SECRET_TOKEN: ${FPP_ANALYTICS_SECRET_TOKEN}
      # Unauthed OTLP HTTP receiver on the ClickStack monitoring-net bridge —
      # same port everything else in the fpp stack uses. :4317 (gRPC) is
      # authed and we don't ship an auth header from the Python exporter.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-analytics
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      BEA_BASE_URL: ${FPP_BEA_BASE_URL}
      BEA_SECRET_KEY: ${FPP_BEA_SECRET_KEY}
    volumes:
      # Read-only — only the updater writes parquet snapshots.
      - fpp-analytics-data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5100/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fpp-analytics.rule=Host(`analytics.free-planning-poker.com`)"
      - "traefik.http.routers.fpp-analytics.entrypoints=websecure"
      - "traefik.http.routers.fpp-analytics.tls.certresolver=letsencrypt"
      - "traefik.http.services.fpp-analytics.loadbalancer.server.port=5100"
      - "traefik.http.routers.fpp-analytics.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.fpp-analytics.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.fpp-analytics.loadbalancer.healthcheck.interval=10s"
      - "com.centurylinklabs.watchtower.enable=false"
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
    networks:
      - proxy
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # fpp-analytics-updater — sleep-loop sidecar that syncs MariaDB → parquet
  # every 10 min. Same image as fpp-analytics; manual restart on image refresh
  # (no zero-downtime requirement — brief gap in a polling cron is fine).
  #
  # Connects to mariadb on the internal mariadb-net. MariaDB enforces TLS via
  # --require-secure-transport=ON so DB_SSL=true is mandatory. The wildcard cert
  # is *.free-planning-poker.com which doesn't match the 'mariadb' hostname, hence
  # DB_SSL_VERIFY=false. This is internal-network-only TLS (encryption without
  # peer auth), which is acceptable here — exposure is bounded by Docker's
  # internal network. Vercel uses db.free-planning-poker.com:33306 with full verify.
  # ---------------------------------------------------------------------------
  fpp-analytics-updater:
    # Separate image name (same content as fpp-analytics) so RollHook's
    # FindMatchingContainer doesn't conflate the two services when deploying
    # fpp-analytics — Discover would otherwise return the first match by
    # bare-name and could pick the updater (which has no allowed_repos label).
    #
    # Deployed via RollHook on every push — see .github/workflows/deploy.yml
    # in jkrumm/free-planning-poker. Two replicas overlap briefly during a
    # 1→2→1 rollout; safe because update_readmodel.py uses PID-scoped temp
    # parquet paths and the DB sync query is idempotent.
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-analytics-updater:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Override the Dockerfile HEALTHCHECK (probes :5100, irrelevant for the
    # sleep-loop sidecar). RollHook waits for "healthy" before swapping, so we
    # need *some* check — DATA_DIR existence is true the moment the entrypoint
    # starts, and bash is always running as PID 1.
    healthcheck:
      test: ["CMD-SHELL", "[ -d /app/data ]"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    entrypoint: ["sh", "-c", "while true; do python update_readmodel.py; sleep 600; done"]
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USERNAME: fpp
      DB_PASSWORD: ${MARIADB_FPP_PASSWORD}
      DB_SSL: "true"
      DB_SSL_VERIFY: "false"
      # Unauthed OTLP HTTP receiver — same endpoint as fpp-analytics. Each
      # sync run initializes its own TracerProvider; shutdown_telemetry
      # flushes on exit.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-analytics-updater
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      UPTIMEKUMA_PUSH_URL: ${UPTIME_KUMA_FPP_ANALYTICS_UPDATER_PUSH_URL}
    volumes:
      - fpp-analytics-data:/app/data
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - mariadb-net
      - monitoring-net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
