---
# Free Planning Poker — single-tenant stack: MariaDB + fpp-server + fpp-analytics.
#
# This compose lives in apps/fpp/ on purpose: MariaDB is exposed on a public port
# so Vercel can reach it. That breaks the repo-wide "no inbound ports" invariant,
# so the deviation is quarantined here rather than poisoning compose.infra.yml.
# See ../../AGENTS.md → Security Invariants for the documented exception.
#
# fpp-server and fpp-analytics are deployed via RollHook from the
# jkrumm/free-planning-poker repo (push to the v1 branch; master is not allowed). fpp-analytics-updater runs
# the same image as fpp-analytics but in a sleep-loop sidecar and is bounced
# manually when its image needs refreshing (no zero-downtime requirement —
# 10-min polling cron, brief restart is fine).
#
# fpp-api is the Free Planning Poker rewrite (v9) on the beta host next.free-planning-poker.com:
# one image serving the API, the WebSocket and the room app on one port. RollHook rolls it on
# every push to master of jkrumm/free-planning-poker; it shares nothing with the v1 services
# above (Postgres schema `fpp`, not MariaDB). Until the cutover v1 stays untouched.
#
# Bootstrap order on a fresh server:
#   1. make networking-up           (Traefik gets *.free-planning-poker.com cert via DNS-01)
#   2. make fpp-cert-sync           (extracts that wildcard cert into apps/fpp/certs/)
#   3. make fpp-up                  (MariaDB starts, refuses to start without certs)
#   4. make fpp-mariadb-setup       (provisions fpp user + grants)
#   5. Manual one-shot: docker login rollhook.jkrumm.com, build+push initial
#      fpp-server / fpp-analytics images so the registry has something to pull.
#   6. fpp-api: make postgres-setup (role + schema fpp), make fpp-env, then `make fpp-api-up` once
#      its first image is in the registry (`make fpp-up` runs it and skips while there is none).

networks:
  mariadb-net:
    external: true
  proxy:
    external: true
  # Shared with compose.infra.yml — fpp-server uses Valkey for room state
  # snapshots so an in-memory room survives a RollHook rolling restart.
  valkey-net:
    external: true
  # Shared Postgres (schema `fpp`) — fpp-api only; the v1 services use MariaDB.
  postgres-net:
    external: true
  # Shared with compose.monitoring.yml — fpp-server and fpp-analytics emit
  # OTLP traces + logs to clickstack:4319 (unauthed receiver, docker-only).
  monitoring-net:
    external: true

volumes:
  mariadb-data:
  fpp-analytics-data:

services:
  mariadb:
    # Held on 11.4 LTS (supported to 2029) on purpose; the deps probe's "mariadb 13.0 (major)" is not a todo.
    # 13.0 is a rolling, non-LTS line, 12.3 is the LTS, and mariadb-upgrade makes a downgrade unsupported.
    # v1 (this database) is frozen and retires at the Postgres cutover. A real bump goes 11.4 -> 11.8 -> 12.3
    # (read each upgrade note), after `make fpp-backup` and a restore drill. compose.dev.yml mirrors this tag.
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    environment:
      MARIADB_DATABASE: ${MARIADB_DB}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: >
      --require-secure-transport=ON
      --ssl-cert=/etc/mysql/certs/cert.pem
      --ssl-key=/etc/mysql/certs/key.pem
      --max-connections=200
      --innodb-buffer-pool-size=1G
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    # Public exposure for Vercel. Cloudflare Tunnel can't proxy raw MySQL protocol
    # (TCP origins require cloudflared/WARP client; Spectrum is Enterprise-only).
    # Mitigations: TLS required (--require-secure-transport), schema-scoped fpp user,
    # fail2ban on auth failures, no remote root. DNS-only A record db.free-planning-poker.com.
    ports:
      - "33306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./certs:/etc/mysql/certs:ro
    networks:
      - mariadb-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Watchtower: excluded from auto-updates — MariaDB is stateful, update manually.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    # journald (not json-file) so fail2ban can watch auth failures via systemd backend.
    # Tag 'mariadb' is matched by /etc/fail2ban/jail.d/mariadb.conf.
    logging:
      driver: journald
      options:
        tag: mariadb

  # ---------------------------------------------------------------------------
  # fpp-server — Bun + Elysia WebSocket server. Public via Cloudflare Tunnel +
  # Traefik. Deployed via RollHook on push to jkrumm/free-planning-poker:v1.
  # ---------------------------------------------------------------------------
  fpp-server:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-server:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      LOG_LEVEL: INFO
      TRPC_URL: https://free-planning-poker.com/api/trpc
      FPP_SERVER_SECRET: ${FPP_SERVER_SECRET}
      # OTLP HTTP receiver on the ClickStack monitoring-net bridge. No auth
      # required — trust boundary is docker network membership.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-server
      # Valkey for room state snapshots — survives RollHook rolling restart.
      # No password (Valkey is on an internal-only Docker network). Unsetting
      # this env var degrades gracefully to in-memory-only behavior.
      REDIS_URL: redis://redis:6379
      # In-app feedback → software-factory door on the mini, over the tailnet
      # (tag:vps → tag:devhost, tcp:8796). Both unset = POST /feedback answers 503;
      # set but wrong = 502.
      # `:-` not `:?`: RollHook's validate step loads this file without apps/fpp/.env
      # (only its rollout step reads it), so a `:?` var rejects every deploy.
      FACTORY_FEEDBACK_URL: https://${MINI_TAILNET_NAME:-}:8796/feedback/free-planning-poker
      FACTORY_FEEDBACK_TOKEN: ${FACTORY_FEEDBACK_TOKEN:-}
    # The VPS does not use MagicDNS: the mini's tailnet name resolves to unrelated
    # public addresses here. The door is `tailscale serve` on the mini, with a cert
    # for the name only, so the URL keeps the name (TLS server name) and this pins
    # it to the tailnet IP.
    extra_hosts:
      - "${MINI_TAILNET_NAME:-mini.invalid}:${MINI_TAILSCALE_IP:-192.0.2.1}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fpp-server.rule=Host(`server.free-planning-poker.com`)"
      - "traefik.http.routers.fpp-server.entrypoints=websecure"
      - "traefik.http.routers.fpp-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.fpp-server.loadbalancer.server.port=3003"
      - "traefik.http.routers.fpp-server.middlewares=rate-limit@file,security-headers@file"
      # Active health check — Traefik stops routing to the draining instance the
      # moment SIGTERM flips /health to 503 (see fpp-server src/index.ts).
      - "traefik.http.services.fpp-server.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.fpp-server.loadbalancer.healthcheck.interval=5s"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo can trigger deploys.
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
      # v1 is frozen on the branch v1; master must never deploy into these containers.
      - "rollhook.allowed_refs=refs/heads/v1"
    networks:
      - proxy
      - valkey-net
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # fpp-analytics — FastAPI read-only analytics API. Reads parquet snapshots
  # written by fpp-analytics-updater. Public via Traefik. RollHook-managed.
  # ---------------------------------------------------------------------------
  fpp-analytics:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-analytics:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
      ANALYTICS_SECRET_TOKEN: ${FPP_ANALYTICS_SECRET_TOKEN}
      # Unauthed OTLP HTTP receiver on the ClickStack monitoring-net bridge —
      # same port everything else in the fpp stack uses. :4317 (gRPC) is
      # authed and we don't ship an auth header from the Python exporter.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-analytics
      OTEL_DEPLOYMENT_ENVIRONMENT: prod
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=free-planning-poker,deployment.environment.name=prod
      EMAIL_GATEWAY_URL: https://email-gateway.${DOMAIN}
      EMAIL_GATEWAY_SECRET_KEY: ${FPP_EMAIL_GATEWAY_SECRET_KEY}
    volumes:
      # Read-only — only the updater writes parquet snapshots.
      - fpp-analytics-data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5100/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fpp-analytics.rule=Host(`analytics.free-planning-poker.com`)"
      - "traefik.http.routers.fpp-analytics.entrypoints=websecure"
      - "traefik.http.routers.fpp-analytics.tls.certresolver=letsencrypt"
      - "traefik.http.services.fpp-analytics.loadbalancer.server.port=5100"
      - "traefik.http.routers.fpp-analytics.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.fpp-analytics.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.fpp-analytics.loadbalancer.healthcheck.interval=10s"
      - "com.centurylinklabs.watchtower.enable=false"
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
      # v1 is frozen on the branch v1; master must never deploy into these containers.
      - "rollhook.allowed_refs=refs/heads/v1"
    networks:
      - proxy
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # fpp-analytics-updater — sleep-loop sidecar that syncs MariaDB → parquet
  # every 10 min. Same content as fpp-analytics; deployed by RollHook (see below).
  #
  # Connects to mariadb on the internal mariadb-net. MariaDB enforces TLS via
  # --require-secure-transport=ON so DB_SSL=true is mandatory. The wildcard cert
  # is *.free-planning-poker.com which doesn't match the 'mariadb' hostname, hence
  # DB_SSL_VERIFY=false. This is internal-network-only TLS (encryption without
  # peer auth), which is acceptable here — exposure is bounded by Docker's
  # internal network. Vercel uses db.free-planning-poker.com:33306 with full verify.
  # ---------------------------------------------------------------------------
  fpp-analytics-updater:
    # Separate image name (same content as fpp-analytics) so RollHook's
    # FindMatchingContainer doesn't conflate the two services when deploying
    # fpp-analytics — Discover would otherwise return the first match by
    # bare-name and could pick the updater (which has no allowed_repos label).
    #
    # Deployed via RollHook on every push to v1 — see .github/workflows/deploy.yml
    # in jkrumm/free-planning-poker. Two replicas overlap briefly during a
    # 1→2→1 rollout; safe because update_readmodel.py uses PID-scoped temp
    # parquet paths and the DB sync query is idempotent.
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-analytics-updater:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Override the Dockerfile HEALTHCHECK (probes :5100, irrelevant for the
    # sleep-loop sidecar). RollHook waits for "healthy" before swapping, so we
    # need *some* check — DATA_DIR existence is true the moment the entrypoint
    # starts, and bash is always running as PID 1.
    healthcheck:
      test: ["CMD-SHELL", "[ -d /app/data ]"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    entrypoint: ["sh", "-c", "while true; do python update_readmodel.py; sleep 600; done"]
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USERNAME: fpp
      DB_PASSWORD: ${MARIADB_FPP_PASSWORD}
      DB_SSL: "true"
      DB_SSL_VERIFY: "false"
      # Unauthed OTLP HTTP receiver — same endpoint as fpp-analytics. Each
      # sync run initializes its own TracerProvider; shutdown_telemetry
      # flushes on exit.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-analytics-updater
      OTEL_DEPLOYMENT_ENVIRONMENT: prod
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=free-planning-poker,deployment.environment.name=prod
      UPTIMEKUMA_PUSH_URL: ${UPTIME_KUMA_FPP_ANALYTICS_UPDATER_PUSH_URL}
    volumes:
      - fpp-analytics-data:/app/data
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - mariadb-net
      - monitoring-net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
      # v1 is frozen on the branch v1; master must never deploy into these containers.
      - "rollhook.allowed_refs=refs/heads/v1"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # fpp-api — Free Planning Poker v9: Bun API + WebSocket + the room app, one image, one port.
  # Public beta host only (next.free-planning-poker.com), noindex, until the cutover.
  # RollHook-managed: deploys come from jkrumm/free-planning-poker on master.
  # ---------------------------------------------------------------------------
  fpp-api:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/fpp-api:latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # The app drains in 20 s on SIGTERM (503 on /api/health, sockets closed with 4002, snapshots
    # flushed); the rest is slack for the runtime. Two containers overlap on every rollout.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      # The image listens on 7740 (PORT default) and applies its migrations on start.
      # Shared VPS Postgres — own schema `fpp`, schema-scoped role. No `?schema=`: every table is
      # schema-qualified and the drizzle journal lives in `fpp` too.
      DATABASE_URL: postgresql://fpp:${FPP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Key of the visitor hash (32+ characters); the app refuses to start without it.
      VISITOR_KEY: ${FPP_VISITOR_KEY}
      # The origin the browser sees: checked on the WebSocket upgrade and on POST /api/contact|feedback.
      ALLOWED_ORIGINS: https://next.free-planning-poker.com
      # Client address for the app's own limits: Cloudflare's header. Believable because Traefik
      # publishes no public port (websecure is bound to the Tailscale IP), so a request reaches it
      # only through the tunnel, which sits behind Cloudflare's edge.
      CLIENT_IP_HEADER: cf-connecting-ip
      # OTLP HTTP receiver on the ClickStack monitoring-net bridge (unauthed, docker-only).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: fpp-api
      # In-app feedback → software-factory door, exactly as fpp-server has it (see there for the
      # extra_hosts pin and why `:-` and not `:?`). Both unset = POST /api/feedback answers 503.
      FACTORY_FEEDBACK_URL: https://${MINI_TAILNET_NAME:-}:8796/feedback/free-planning-poker
      FACTORY_FEEDBACK_TOKEN: ${FACTORY_FEEDBACK_TOKEN:-}
      # POST /api/contact → mail gateway, as fpp-server gets it: base URL with no path (the app
      # appends /fpp) and the same 1Password item. An empty secret = the route answers 503.
      EMAIL_GATEWAY_URL: https://email-gateway.${DOMAIN:-}
      EMAIL_GATEWAY_SECRET_KEY: ${FPP_EMAIL_GATEWAY_SECRET_KEY:-}
    extra_hosts:
      - "${MINI_TAILNET_NAME:-mini.invalid}:${MINI_TAILSCALE_IP:-192.0.2.1}"
    healthcheck:
      # Same probe as the image's own HEALTHCHECK (alpine: wget, no curl). 503 while draining.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7740/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fpp-api.rule=Host(`next.free-planning-poker.com`)"
      - "traefik.http.routers.fpp-api.entrypoints=websecure"
      - "traefik.http.routers.fpp-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.fpp-api.loadbalancer.server.port=7740"
      - "traefik.http.routers.fpp-api.middlewares=fpp-api-ratelimit,fpp-api-noindex,security-headers@file"
      # Active health check — Traefik stops routing to the draining instance the moment SIGTERM
      # flips /api/health to 503. Open WebSockets stay; the app closes them with 4002.
      - "traefik.http.services.fpp-api.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.fpp-api.loadbalancer.healthcheck.interval=5s"
      # Beta host: search engines are told not to index it until the cutover.
      - "traefik.http.middlewares.fpp-api-noindex.headers.customresponseheaders.X-Robots-Tag=noindex"
      # Not rate-limit@file (100/s, burst 200 per Cf-Connecting-Ip): a room of 30 behind one office
      # address opens the room app at once, a cold load is on the order of 30 requests (entry
      # script, a chunk per feature and language, fonts), so 30 people send ~900 in a few seconds
      # and the shared bucket answers 429 for the last third of them. Same per-client key and same
      # sustained rate; the burst holds 50 cold loads and refills in 15 s. A WebSocket upgrade is
      # one request and frames are not counted; the app limits per client itself (4008, 429).
      - "traefik.http.middlewares.fpp-api-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.fpp-api-ratelimit.ratelimit.burst=1500"
      - "traefik.http.middlewares.fpp-api-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.fpp-api-ratelimit.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo, only its master (v1 deploys go to the
      # three services above from the branch v1; the labels keep the two lines apart).
      - "rollhook.allowed_repos=jkrumm/free-planning-poker"
      - "rollhook.allowed_refs=refs/heads/master"
    networks:
      - proxy
      - postgres-net
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
