---
# email-gateway — Bun + Elysia + SES. Sends FPP contact-form,
# daily-analytics, and SY Serendipity charter-request emails. Public via
# Cloudflare Tunnel + Traefik at
# email-gateway.${DOMAIN}. Deployed via RollHook on push to
# jkrumm/email-gateway:master. SQLite (emails, AI enrichments, spam-filter
# submissions) lives in /var/lib/email-gateway, owned by the image's app user
# (uid 100 / gid 101) — WAL-safe for RollHook's brief two-container overlap.

networks:
  proxy:
    external: true

services:
  email-gateway:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/email-gateway:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    environment:
      NODE_ENV: production
      SECRET_KEY: ${EMAIL_GATEWAY_SECRET_KEY}
      SES_REGION: eu-central-1
      SES_ACCESS_KEY_ID: ${EMAIL_GATEWAY_SES_ACCESS_KEY_ID}
      SES_SECRET_ACCESS_KEY: ${EMAIL_GATEWAY_SES_SECRET_ACCESS_KEY}
      SES_CONFIGURATION_SET: email-gateway
      SES_SNS_TOPIC_ARN: ${EMAIL_GATEWAY_SES_SNS_TOPIC_ARN}
      RECEIVER_EMAIL: ${EMAIL_GATEWAY_RECEIVER_EMAIL}
      SY_SERENDIPITY_RECEIVER_EMAIL: ${EMAIL_GATEWAY_SY_SERENDIPITY_RECEIVER_EMAIL}
      # Sender on the verified jkrumm.com domain; the owner chose hello@ for SY mail
      # (the request receiver mail and the requester's confirmation).
      SY_SERENDIPITY_FROM_EMAIL: "SY Serendipity I <hello@jkrumm.com>"
      # Public POST /jkrumm-contact (static personal site, no bearer): allowed browser Origins.
      JKRUMM_CONTACT_ORIGINS: "https://jkrumm.com,https://www.jkrumm.com"
      JKRUMM_CONTACT_FROM_EMAIL: "jkrumm.com <hello@jkrumm.com>"
      JKRUMM_CONTACT_RECEIVER_EMAIL: "hello@jkrumm.com"
      # POST /shutterflow: Shutterflow's auth codes, own bearer; shutterflow.app is a verified SES identity.
      SHUTTERFLOW_SECRET_KEY: ${EMAIL_GATEWAY_SHUTTERFLOW_SECRET_KEY}
      SHUTTERFLOW_FROM_EMAIL: "Shutterflow <noreply@shutterflow.app>"
      LLM_BASE_URL: ${EMAIL_GATEWAY_LLM_BASE_URL}
      LLM_API_KEY: ${EMAIL_GATEWAY_LLM_API_KEY}
      LLM_MODEL: gpt-6-luna
      OPENROUTER_API_KEY: ${EMAIL_GATEWAY_OPENROUTER_API_KEY}
      DECISION_PROVIDER: ue
      DECISION_MODEL: pplx-decider-v1-27b
      ARGO_USAGE_URL: ${EMAIL_GATEWAY_ARGO_USAGE_URL}
      ARGO_API_SECRET: ${EMAIL_GATEWAY_ARGO_API_SECRET}
      MACHINE: vps
      IMAP_HOST: ${EMAIL_GATEWAY_IMAP_HOST}
      IMAP_USER: ${EMAIL_GATEWAY_IMAP_USER}
      IMAP_PASSWORD: ${EMAIL_GATEWAY_IMAP_PASSWORD}
      IMAP_TLS_INSECURE: "true"
      ADMIN_PASSWORD: ${EMAIL_GATEWAY_ADMIN_PASSWORD}
      API_KEY: ${EMAIL_GATEWAY_API_KEY}
      SY_SERENDIPITY_READ_KEY: ${EMAIL_GATEWAY_SY_SERENDIPITY_READ_KEY}
      DATA_DIR: /data
    volumes:
      - /var/lib/email-gateway:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.email-gateway.rule=Host(`email-gateway.${DOMAIN}`)"
      - "traefik.http.routers.email-gateway.entrypoints=websecure"
      - "traefik.http.routers.email-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.email-gateway.loadbalancer.server.port=3010"
      - "traefik.http.routers.email-gateway.middlewares=rate-limit@file,security-headers@file"
      # Active health check — Traefik stops routing to draining instance the
      # moment the container's HEALTHCHECK flips unhealthy.
      - "traefik.http.services.email-gateway.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.email-gateway.loadbalancer.healthcheck.interval=10s"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo can trigger deploys.
      - "rollhook.allowed_repos=jkrumm/email-gateway"
    networks:
      - proxy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
