# weatherorb.com — one static page ("WeatherOrb is being rebuilt."), served by nginx from ./site.
#
# WeatherOrb V1 (the nginx edge, the account service, the alert egress proxy and the /v1 probe) was
# taken off this server on 2026-11-17: it was stopped on 2026-11-12 and had no users, and V2 is a
# rewrite that serves nothing public before its product stage. The apex stays up because the V2
# capture jobs name https://weatherorb.com as their contact to MET Norway and others.
#
# Same shape as photo-gallery (nginx:alpine, a read-only bind mount, no registry, no RollHook), with
# the content in this repo: a change to site/ ships with `make deploy APP=weatherorb`, and the
# directory mount picks up a pulled file without a restart. Watchtower keeps the nginx image patched.
#
# Public via the Cloudflare Tunnel (apex + www CNAMEs → the tunnel, orange cloud, each with a tunnel
# ingress hostname). The router hosts are literal: weatherorb.com is its own zone, not ${DOMAIN}.

networks:
  proxy:
    external: true

services:
  weatherorb-site:
    image: nginx:alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first and nginx answers on IPv4.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.weatherorb.rule=Host(`weatherorb.com`)"
      - "traefik.http.routers.weatherorb.entrypoints=websecure"
      - "traefik.http.routers.weatherorb.tls.certresolver=letsencrypt"
      - "traefik.http.routers.weatherorb.tls.domains[0].main=weatherorb.com"
      - "traefik.http.routers.weatherorb.tls.domains[0].sans=www.weatherorb.com"
      - "traefik.http.routers.weatherorb.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.weatherorb.loadbalancer.server.port=80"
      - "traefik.http.services.weatherorb.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.weatherorb.loadbalancer.healthcheck.interval=30s"
      # www → canonical redirect (301 permanent)
      - "traefik.http.routers.weatherorb-www.rule=Host(`www.weatherorb.com`)"
      - "traefik.http.routers.weatherorb-www.entrypoints=websecure"
      - "traefik.http.routers.weatherorb-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.weatherorb-www.middlewares=www-to-weatherorb@docker"
      - "traefik.http.middlewares.www-to-weatherorb.redirectregex.regex=^https://www\\.weatherorb\\.com/(.*)"
      - "traefik.http.middlewares.www-to-weatherorb.redirectregex.replacement=https://weatherorb.com/$${1}"
      - "traefik.http.middlewares.www-to-weatherorb.redirectregex.permanent=true"
    networks:
      - proxy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
