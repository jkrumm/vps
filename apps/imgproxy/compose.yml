# imgproxy — on-the-fly image resizing/format-conversion over the `img/` prefix
# of the existing private object-storage bucket. Serves img.${DOMAIN} publicly
# through the Cloudflare tunnel; Cloudflare's edge cache is the CDN layer.
#
# Phase 1 of the image CDN. The later self-built photo service (shutterflow.app)
# is a separate project that will consume this same substrate.
#
# URL scheme — UNSIGNED (no IMGPROXY_KEY / IMGPROXY_SALT):
#   https://img.${DOMAIN}/insecure/rs:fit:800/plain/s3://<bucket>/img/fuji/x.jpg@webp
# Omitting key+salt puts imgproxy in unsigned mode, where the `/insecure` prefix
# is required. Access control is therefore NOT the URL — it is the B2 key's
# server-enforced `img/` name-prefix (authoritative) plus IMGPROXY_ALLOWED_SOURCES
# below (defence in depth) and non-enumerable object keys. Staying unsigned is a
# permanent decision, not a deferred upgrade — see docs/image-cdn.md for why.
#
# !! THIS BUCKET ALSO HOLDS DATABASE BACKUPS under backups/. The credential here
# MUST be an application key created with `--name-prefix img/` — B2 enforces that
# server-side, so it is the control that keeps this public, unauthenticated
# service away from the dumps. IMGPROXY_S3_ALLOWED_BUCKETS is NOT sufficient on
# its own here, because backups/ lives in the same bucket. Never point this at
# the AWS_* backup credential in .env.tpl — that one is bucket-wide.

networks:
  proxy:
    external: true
  monitoring-net:
    external: true

services:
  imgproxy:
    # Major-pinned: watchtower tracks v4.x patch releases, never a v4→v5 jump.
    image: ghcr.io/imgproxy/imgproxy:v4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # libvips holds decoded frames in memory; 100 MP of source needs headroom.
    mem_limit: 1g
    environment:
      IMGPROXY_BIND: ":8080"
      # Workers default to CPU count (12 here) — each can hold a decoded image,
      # so cap it well below mem_limit rather than letting it scale with cores.
      IMGPROXY_WORKERS: "4"

      # --- S3 source (Backblaze B2, S3-compatible API) ---
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_REGION: ${IMGPROXY_B2_REGION}
      IMGPROXY_S3_ENDPOINT: ${IMGPROXY_B2_ENDPOINT}
      # B2 requires path-style addressing (endpoint/bucket, not bucket.endpoint).
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      # imgproxy reads the standard AWS names. Fed from the imgproxy-specific
      # read-only, img/-prefixed key — deliberately NOT the AWS_* backup
      # credential, which is bucket-wide and can read backups/.
      AWS_ACCESS_KEY_ID: ${IMGPROXY_B2_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${IMGPROXY_B2_APP_KEY}

      # --- URL shortening ---
      # Maps a virtual prefix onto the real bucket path, so public URLs carry
      # neither the bucket name nor the img/ prefix. Applied BEFORE the
      # ALLOWED_SOURCES check, so that check still sees (and must whitelist) the
      # post-replacement s3:// form below.
      #
      # Two aliases, both resolving to the same place:
      #   img/   — the canonical one. NO double slash, which is required: the
      #            Traefik short-URL rewrite emits this form, and Traefik 3.x
      #            rejects any rewrite whose output changes under path
      #            sanitization (`img://` collapses to `img:/` and is refused).
      #   img:// — kept only so previously-published URLs keep resolving.
      # The patterns are disjoint: `img://…` never matches the `img/` prefix
      # because its 4th character is `:`.
      IMGPROXY_URL_REPLACEMENTS: "img://=s3://${IMGPROXY_B2_BUCKET}/img/;img/=s3://${IMGPROXY_B2_BUCKET}/img/"

      # --- Source lock ---
      # Comma-separated URL *prefixes*, not regex. Both trailing slashes are
      # load-bearing: `s3://<bucket>/img` without one would also match
      # `s3://<bucket>/img-backups/`.
      # This is the second layer only — the B2 key's own `--name-prefix img/`
      # is the authoritative one, because it is enforced server-side.
      IMGPROXY_ALLOWED_SOURCES: "s3://${IMGPROXY_B2_BUCKET}/img/"
      # Added in v4.0.0. Weak on its own here (backups/ is in the same bucket),
      # but it still blocks reaching any *other* bucket in the account.
      IMGPROXY_S3_ALLOWED_BUCKETS: ${IMGPROXY_B2_BUCKET}
      # SSRF hardening. Moot while sources are S3-only, but free insurance if
      # an http:// source is ever allowed: default is true, so it must be
      # turned off explicitly.
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: "false"

      # --- Caching (Cloudflare edge is the real CDN; this sets what it obeys) ---
      IMGPROXY_TTL: "31536000" # 1 year — renditions are immutable per URL
      IMGPROXY_CACHE_CONTROL_PASSTHROUGH: "false" # ignore B2's headers, use TTL

      # --- Format negotiation via Accept header ---
      # Serves AVIF/WebP when the client advertises support, unless the URL
      # asked for a specific extension. Priority: JXL > AVIF > WebP.
      # NOTE: this makes responses vary by Accept — see docs/image-cdn.md for
      # the Cloudflare `Vary` caveat before adding more auto-formats.
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"

      # --- Observability (see docs/observability.md) ---
      # Traefik already traces the request at the edge, but only as one opaque
      # span — it cannot separate B2 download time from libvips processing time,
      # nor surface queue depth or per-stage errors. These add imgproxy's own
      # view underneath that span.
      #
      # v4 replaced the IMGPROXY_OPEN_TELEMETRY_{ENDPOINT,PROTOCOL,...} vars with
      # the standard OTEL_* ones — but the ENABLE flags below survived and are
      # still required. Setting only the OTEL_* vars leaves telemetry off, and
      # imgproxy reports it on startup rather than failing:
      #   msg="OpenTelemetry monitoring" enabled=false logs=false metrics=false
      # Check that line after any change here; it is the ground truth.
      IMGPROXY_OPEN_TELEMETRY_ENABLE: "true"
      IMGPROXY_OPEN_TELEMETRY_ENABLE_METRICS: "true"
      IMGPROXY_OPEN_TELEMETRY_ENABLE_LOGS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: imgproxy

      # --- Source limits ---
      # 100 MP: a 40 MP Fuji frame fits with room for stitched panoramas.
      IMGPROXY_MAX_SRC_RESOLUTION: "100"
      IMGPROXY_MAX_SRC_FILE_SIZE: "52428800" # 50 MB
    healthcheck:
      # `imgproxy health` GETs /health and exits non-zero on anything but 200.
      #
      # LIVENESS ONLY — it does NOT exercise libvips or the S3 source. Docs:
      # "returns an HTTP Status of 200 OK if the server has been successfully
      # started". Confirmed here: health checks produce zero OTLP spans, so they
      # never enter the traced processing path.
      #
      # Consequence: an imgproxy that is healthy but cannot reach B2, or whose
      # credential has expired, still reports healthy and Traefik keeps routing
      # to it. Renders 404 while the container looks fine. Detection has to come
      # from the OTLP error rate, not this probe.
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.imgproxy.loadbalancer.server.port=8080"
      - "traefik.http.services.imgproxy.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.imgproxy.loadbalancer.healthcheck.interval=30s"

      # --- Two routers, so both URL styles work ---
      #
      # 1. imgproxy-raw (priority 100) — paths that already carry a signature
      #    slot pass through untouched:  /_/rs:fit:800/plain/img://misc/x.jpg
      #
      # 2. imgproxy (priority 1, catch-all) — everything else is rewritten into
      #    the raw form, giving the short public URL:  /rs:fit:800/misc/x.jpg
      #
      # The split exists because the rewrite regex is not idempotent: applied to
      # an already-raw path it would nest a second `plain/img://` and break it.
      # Matching the signature slot first is what keeps the rewrite off them.

      - "traefik.http.routers.imgproxy-raw.rule=Host(`img.${DOMAIN}`) && (PathPrefix(`/_/`) || PathPrefix(`/insecure/`))"
      - "traefik.http.routers.imgproxy-raw.priority=100"
      - "traefik.http.routers.imgproxy-raw.entrypoints=websecure"
      - "traefik.http.routers.imgproxy-raw.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imgproxy-raw.service=imgproxy"
      - "traefik.http.routers.imgproxy-raw.middlewares=rate-limit@file,security-headers@file"

      - "traefik.http.routers.imgproxy.rule=Host(`img.${DOMAIN}`)"
      - "traefik.http.routers.imgproxy.priority=1"
      - "traefik.http.routers.imgproxy.entrypoints=websecure"
      - "traefik.http.routers.imgproxy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imgproxy.service=imgproxy"
      - "traefik.http.routers.imgproxy.middlewares=rate-limit@file,security-headers@file,imgproxy-short@docker"

      # Group 1 captures any leading `opt:val/` segments (imgproxy processing
      # options always contain a colon; bucket path segments never do), group 2
      # is the object key. `$$` escapes compose interpolation — Traefik sees `$`.
      - "traefik.http.middlewares.imgproxy-short.replacepathregex.regex=^/((?:[a-zA-Z0-9_]+:[^/]+/)*)(.+)$$"
      - "traefik.http.middlewares.imgproxy-short.replacepathregex.replacement=/_/$${1}plain/img/$${2}"

      # --- Origin hostname for monitoring (Tailscale-only, NOT behind Cloudflare) ---
      # Uptime Kuma cannot meaningfully probe img.${DOMAIN}: renditions carry a
      # 1-year TTL, so after the first check Cloudflare answers from the edge
      # forever and the monitor stays green even if imgproxy or B2 is dead.
      # This hostname is a DNS-only (grey-cloud) A record → VPS Tailscale IP, so
      # probes land on Traefik directly and every check performs a real B2 fetch
      # plus a real libvips render. Same wildcard cert, same rewrite middleware.
      # CGNAT makes the address unreachable from the public internet, so the DNS
      # record itself is the access control (see AGENTS.md → Networks).
      - "traefik.http.routers.imgproxy-origin.rule=Host(`img-origin.${DOMAIN}`)"
      - "traefik.http.routers.imgproxy-origin.priority=50"
      - "traefik.http.routers.imgproxy-origin.entrypoints=websecure"
      - "traefik.http.routers.imgproxy-origin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imgproxy-origin.service=imgproxy"
      - "traefik.http.routers.imgproxy-origin.middlewares=rate-limit@file,security-headers@file,imgproxy-short@docker"
    networks:
      - proxy
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
