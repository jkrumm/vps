---
# argo — personal stack (api + dashboard).
#
# Single host (argo.jkrumm.com), Tailscale-only via DNS-only A record → VPS Tailscale IP.
# Two routers on the same host:
#   PathPrefix(`/api`)  priority 100  → argo-api    (with stripprefix /api)
#   default             priority 1    → argo-dashboard (nginx static SPA)
#
# Both deployed via RollHook from jkrumm/argo (push to master). Dashboard rebuild
# embeds VITE_API_URL=https://argo.jkrumm.com/api at build time. API queries homelab
# services over Tailscale (garmin-collector, homelab's docker socket-proxy, uptime-kuma).
#
# Bootstrap order on a fresh server:
#   1. make networking-up + monitoring-up        (Traefik cert + ClickStack for OTLP)
#   2. make postgres-setup                       (creates argo role + schema)
#   3. cf DNS: argo.jkrumm.com → ${VPS_TAILSCALE_IP} (grey cloud / DNS-only)
#   4. push to jkrumm/argo:master → RollHook builds + deploys both services
#      (drizzle migrations run on API start — nothing to seed by hand)

networks:
  proxy:
    external: true
  postgres-net:
    external: true
  monitoring-net:
    external: true
  # Shared with compose.infra.yml — argo-api uses Valkey for durable/resumable
  # Hermes chat streaming (resumable-stream pub/sub + sentinel) so a dropped
  # client connection can resume an in-flight assistant turn.
  valkey-net:
    external: true
  socket-proxy-monitoring-net:
    external: true
    name: vps_socket-proxy-monitoring-net

services:

  # ---------------------------------------------------------------------------
  # argo-api — Bun + Elysia + Postgres. Reads VPS docker via socket-proxy-monitoring;
  # reads homelab docker via ${HOMELAB_TAILSCALE_IP}:2376 (socket-proxy-claude).
  # Reaches uptime-kuma via public https://uptime.jkrumm.com (socket.io).
  # Reaches garmin-collector via https://garmin.jkrumm.com (Tailscale-only).
  # ---------------------------------------------------------------------------
  argo-api:
    # Per-service IMAGE var so `make argo-up` can pin both services to the
    # currently-running SHAs without one variable bleeding into the other.
    # RollHook deploys also set the appropriate var per service.
    image: ${ARGO_API_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/argo-api:latest}}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      API_SECRET: ${API_SECRET}
      TICKTICK_API_KEY: ${TICKTICK_API_KEY}
      UPTIME_KUMA_URL: https://uptime.jkrumm.com
      UPTIME_KUMA_USERNAME: ${UPTIME_KUMA_USERNAME}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD}
      UPTIME_KUMA_API_KEY: ${UPTIME_KUMA_API_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_READ_TOKEN: ${SLACK_READ_TOKEN}
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_ALLOWED_EMAIL: ${GOOGLE_ALLOWED_EMAIL}
      # Garmin-collector lives on homelab (Tailscale-only public DNS).
      GARMIN_COLLECTOR_URL: https://garmin.jkrumm.com
      GARMIN_COLLECTOR_TOKEN: ${GARMIN_COLLECTOR_TOKEN}
      GARMIN_HEARTBEAT_URL: ${GARMIN_HEARTBEAT_URL}
      # Atlassian (Jira) — IU work tenant, read-only basic auth.
      ATLASSIAN_BASE_URL: ${ATLASSIAN_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      JIRA_BOARD_ID: ${JIRA_BOARD_ID}
      # GitLab — IU work on gitlab.com, read-only PAT (read_api + read_user).
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      # Hardcover — book taste layer. Reading vertical's hardcover-sync cron +
      # /reading/sync pull the shelf. Backend-only GraphQL bearer (bare JWT).
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY}
      # Hermes Chat AI gateway — deepseek-v4.1-flash thread titling, called
      # directly on the IU unified endpoint (public HTTPS, EU/GDPR). Same creds
      # local + prod. Model id + reasoning effort are NOT passed here — omitted
      # so apps/api/src/env.ts's own default is the single source of truth (same
      # pattern as PORT, left unset in this block).
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # Audio gateway — STT + expressive TTS, forwarded over the shared proxy net.
      AUDIO_GATEWAY_URL: ${AUDIO_GATEWAY_URL:-http://audio-gateway:7714}
      # Hermes chat upstream — Mac Mini OpenAI-compatible API over Tailscale (8642).
      HERMES_BASE_URL: ${HERMES_BASE_URL}
      HERMES_API_KEY: ${HERMES_API_KEY}
      # Docker socket proxies — VPS local + homelab over Tailscale.
      DOCKER_VPS_URL: http://socket-proxy-monitoring:2375
      DOCKER_HOMELAB_URL: http://${HOMELAB_TAILSCALE_IP}:2376
      # Shared VPS Postgres — own schema `argo`, schema-scoped user.
      DATABASE_URL: postgresql://argo:${ARGO_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=argo
      # Valkey (container `redis` on valkey-net) — durable/resumable Hermes chat
      # streaming. Empty would disable durability; set so a dropped connection resumes.
      REDIS_URL: redis://redis:6379
      # OpenTelemetry — sends traces to ClickStack via the unauthed :4319 port
      # (see clickstack/otel-custom.yaml). Bound to the docker bridge only;
      # never published to host or routed via Traefik. The :4318 port stays
      # authed for browser SDK ingress through Traefik.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: argo-api
    volumes:
      - /var/lib/argo/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.argo-api.rule=Host(`argo.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.argo-api.entrypoints=websecure"
      - "traefik.http.routers.argo-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.argo-api.priority=100"
      - "traefik.http.routers.argo-api.middlewares=argo-api-stripprefix,security-headers@file"
      - "traefik.http.middlewares.argo-api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.services.argo-api.loadbalancer.server.port=4000"
      - "traefik.http.services.argo-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.argo-api.loadbalancer.healthcheck.interval=10s"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo can trigger deploys.
      - "rollhook.allowed_repos=jkrumm/argo"
    networks:
      - proxy
      - postgres-net
      - monitoring-net
      - valkey-net
      - socket-proxy-monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # argo-dashboard — Vite + React 19 + Mantine v9 SPA, served by nginx.
  # Static bundle. VITE_API_URL + HyperDX vars baked at build time via rollhook.
  # ---------------------------------------------------------------------------
  argo-dashboard:
    image: ${ARGO_DASHBOARD_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/argo-dashboard:latest}}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.argo-dashboard.rule=Host(`argo.${DOMAIN}`)"
      - "traefik.http.routers.argo-dashboard.entrypoints=websecure"
      - "traefik.http.routers.argo-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.argo-dashboard.priority=1"
      - "traefik.http.routers.argo-dashboard.middlewares=security-headers@file"
      - "traefik.http.services.argo-dashboard.loadbalancer.server.port=80"
      - "traefik.http.services.argo-dashboard.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.argo-dashboard.loadbalancer.healthcheck.interval=10s"
      # Same-origin OTLP routes so the browser HyperDX SDK can post traces/logs
      # to argo.${DOMAIN}/v1/traces (avoids CORS preflight to clickstack). Routed
      # to the existing clickstack-otel service on the monitoring stack.
      - "traefik.http.routers.argo-otel-traces.rule=Host(`argo.${DOMAIN}`) && Path(`/v1/traces`)"
      - "traefik.http.routers.argo-otel-traces.entrypoints=websecure"
      - "traefik.http.routers.argo-otel-traces.tls.certresolver=letsencrypt"
      - "traefik.http.routers.argo-otel-traces.priority=200"
      - "traefik.http.routers.argo-otel-traces.service=clickstack-otel@docker"
      - "traefik.http.routers.argo-otel-logs.rule=Host(`argo.${DOMAIN}`) && Path(`/v1/logs`)"
      - "traefik.http.routers.argo-otel-logs.entrypoints=websecure"
      - "traefik.http.routers.argo-otel-logs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.argo-otel-logs.priority=200"
      - "traefik.http.routers.argo-otel-logs.service=clickstack-otel@docker"
      - "com.centurylinklabs.watchtower.enable=false"
      - "rollhook.allowed_repos=jkrumm/argo"
    networks:
      - proxy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
