---
# audio-gateway — OpenAI-compatible audio service (STT + expressive Gemini TTS).
# Fronts the IU unified audio endpoint; single source of truth for audio in the
# personal stack.
#
# Tailscale-only via DNS-only (grey) A record audio-gateway.jkrumm.com → VPS Tailscale IP.
# NOT behind the cloudflared tunnel — same pattern as argo.jkrumm.com.
# Traefik labels are identical to a public service; tailnet-only is at the DNS layer.
#
# RollHook manages zero-downtime rolling deploys (push to jkrumm/audio-gateway:master).
# No database — usage SQLite DB written to host volume /var/lib/audio-gateway/.
#
# Bootstrap order on a fresh server:
#   1. make audio-gateway-env               (materializes apps/audio-gateway/.env)
#   2. make audio-gateway-bootstrap-image   (builds + pushes :initial to registry)
#   3. push to jkrumm/audio-gateway:master  (RollHook deploys)

networks:
  proxy:
    external: true
  # Reaches ClickStack's unauthed OTLP receiver (clickstack:4319) for traces + logs.
  monitoring-net:
    external: true

services:
  audio-gateway:
    image: ${IMAGE_TAG:-rollhook.jkrumm.com/audio-gateway:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # RollHook brings the replacement container up first, then SIGTERMs this one:
    # the drain (SHUTDOWN_DRAIN_MS, 60 s) finishes in-flight STT/TTS requests and
    # Docker waits a little longer than that before SIGKILL.
    stop_grace_period: 90s
    environment:
      NODE_ENV: production
      PORT: "7714"
      IU_API_KEY: ${IU_API_KEY}
      IU_OPENAI_BASE_URL: ${IU_OPENAI_BASE_URL}
      IU_GEMINI_BASE_URL: ${IU_GEMINI_BASE_URL}
      USAGE_DB: ${USAGE_DB}
      STT_PROMPT: ${STT_PROMPT}
      # Usage telemetry → Argo: 'both' keeps the local SQLite and pushes each request
      # to argo-api over the shared proxy net (internal route, mirrors research-gateway).
      USAGE_SINK: ${USAGE_SINK}
      USAGE_HTTP_URL: ${USAGE_HTTP_URL}
      USAGE_SOURCE_LABEL: ${USAGE_SOURCE_LABEL}
      ARGO_API_SECRET: ${ARGO_API_SECRET}
      MACHINE: ${MACHINE}
      # Traces + logs → ClickStack (HyperDX). Unset disables the exporter entirely.
      # SQLite/Argo usage rows stay the cost accounting; this is the timeline view.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      # Header-free caller identity for clients that cannot send x-audio-source
      # (Hermes' stock OpenAI client, MacWhisper). PROXY_API_KEY is empty here —
      # the tailnet gates access — so these are labels, not credentials: a client
      # authenticating with `Bearer hermes` shows up as audio.caller=hermes.
      AUDIO_CALLER_TOKENS: hermes=hermes,macwhisper=macwhisper
      SHUTDOWN_DRAIN_MS: "60000"
      # The podcast pipeline lives on the mini instance (audio-gateway
      # docs/podcast-editorial-room.md, Decision 2): the brain vault and the
      # research gateway are only reachable there. This container is STT/TTS
      # only and answers /v1/podcasts* with a 410 pointing at podcasts.mini.jkrumm.com,
      # so none of the PODCAST_* / IMAGE_GATEWAY_* / ABS_* wiring belongs here.
      PODCAST_ENABLED: "false"
    volumes:
      # Usage SQLite DB survives redeploys. Matches USAGE_DB=/data/usage.db.
      - /var/lib/audio-gateway:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7714/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audio-gateway.rule=Host(`audio-gateway.${DOMAIN}`)"
      - "traefik.http.routers.audio-gateway.entrypoints=websecure"
      - "traefik.http.routers.audio-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.routers.audio-gateway.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.audio-gateway.loadbalancer.server.port=7714"
      - "traefik.http.services.audio-gateway.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.audio-gateway.loadbalancer.healthcheck.interval=10s"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo can trigger deploys.
      - "rollhook.allowed_repos=jkrumm/audio-gateway"
    networks:
      - proxy
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
