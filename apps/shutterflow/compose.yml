# shutterflow — the share server (accounts, albums, share links, public galleries) at
# shutterflow.app plus its dedicated, SIGNED imgproxy CDN at cdn.shutterflow.app.
# Source: jkrumm/shutterflow (private) — docs/engineering/deploy.md, decisions 0018/0019/0021.
#
# Both hostnames reach Traefik only through the Cloudflare tunnel: Traefik publishes no public
# port (websecure is bound to the Tailscale IP), so a direct hit on the VPS public IP never
# reaches these routers. That is what makes `cf-connecting-ip` trustworthy for the share
# server's per-IP rate limits (TRUSTED_PROXY_HEADERS below).
#
# No `rate-limit@file` on either router, deliberately: behind cloudflared every request
# arrives from the tunnel's one source IP, so Traefik's per-IP limiter would be a single global
# bucket. The share server limits per client IP itself (better-auth, keyed on cf-connecting-ip).
#
# Bootstrap order on a fresh server:
#   1. make postgres-setup                    (creates the shutterflow role + schema)
#   2. make shutterflow-env                   (materializes apps/shutterflow/.env)
#   3. make shutterflow-bootstrap-image       (seeds rollhook.jkrumm.com/shutterflow-share)
#   4. make shutterflow-up                    (genesis start; migrations run on boot)
#   5. push to jkrumm/shutterflow:master     → RollHook deploys from then on

networks:
  proxy:
    external: true
  postgres-net:
    external: true
  monitoring-net:
    external: true
  # Hosted storage (shutterflow 0040): the share server ↔ key broker request path. Internal, so
  # nothing else reaches the broker and the broker reaches nothing through it.
  shutterflow-broker:
    internal: true
  # The broker's only way out: B2's API (an internal network has no outbound route).
  shutterflow-broker-egress: {}

volumes:
  # The broker's purge ledger (closed accounts and their grace periods), its only state.
  shutterflow-key-broker-state: {}

services:

  # ---------------------------------------------------------------------------
  # shutterflow-share — Bun + Elysia + better-auth + Drizzle; serves the gallery SPA too.
  # ---------------------------------------------------------------------------
  shutterflow-share:
    image: ${SHUTTERFLOW_SHARE_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/shutterflow-share:latest}}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      NODE_ENV: production
      # The image's own default port.
      PORT: "4100"
      BETTER_AUTH_URL: https://shutterflow.app
      BETTER_AUTH_SECRET: ${SHUTTERFLOW_BETTER_AUTH_SECRET}
      # Shared VPS Postgres — own schema `shutterflow`, schema-scoped role. No `?schema=` here:
      # the postgres.js driver forwards unknown URL params as server startup parameters and
      # Postgres refuses `schema`. Every table is schema-qualified (pgSchema) and the migration
      # journal lives in `shutterflow` too (migrationsSchema), so no search_path is needed.
      DATABASE_URL: postgresql://shutterflow:${SHUTTERFLOW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Mail: auth codes go through the email gateway (SES; it owns the template and the
      # noreply@shutterflow.app sender).
      EMAIL_GATEWAY_URL: https://email-gateway.${DOMAIN}
      EMAIL_GATEWAY_SECRET_KEY: ${SHUTTERFLOW_EMAIL_GATEWAY_SECRET_KEY}
      # SSO — Google only (GitHub skipped).
      GOOGLE_CLIENT_ID: ${SHUTTERFLOW_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${SHUTTERFLOW_GOOGLE_CLIENT_SECRET}
      # Client IP for rate limiting: Cloudflare's header, believed only when the direct peer is
      # inside TRUSTED_PROXIES (the `proxy` network — i.e. Traefik). The CIDR is read from
      # `docker network inspect proxy` by `make shutterflow-env`, not written here.
      TRUSTED_PROXY_HEADERS: cf-connecting-ip
      TRUSTED_PROXIES: ${SHUTTERFLOW_TRUSTED_PROXIES}
      # Signed CDN URLs — same key/salt as the imgproxy service below.
      IMGPROXY_BASE_URL: https://cdn.shutterflow.app
      IMGPROXY_KEY: ${SHUTTERFLOW_IMGPROXY_KEY}
      IMGPROXY_SALT: ${SHUTTERFLOW_IMGPROXY_SALT}
      # Master serving (shutterflow 0042): photos are signed imgproxy URLs on the synced Finals.
      # The server holds no masters key; it only names the prefix and signs.
      MASTERS_BUCKET: ${SHUTTERFLOW_B2_BUCKET}
      MASTERS_PREFIX: shutterflow/prod/masters/
      # The zip and the publish check fetch on the internal network, never through Cloudflare.
      IMGPROXY_INTERNAL_URL: http://shutterflow-imgproxy:8080
      # The canary's reference master (0042 safety 5): at boot and nightly it fetches every
      # variant through the public CDN and scans it; a leak switches master serving off.
      # Values live in 1Password (they name the owner's account id and a file).
      CANARY_OBJECT_KEY: ${SHUTTERFLOW_CANARY_OBJECT_KEY}
      CANARY_SHA256: ${SHUTTERFLOW_CANARY_SHA256}
      # Custom domains (0037): the entitled user ids. Empty turns the feature off (403).
      CUSTOM_DOMAINS_USER_IDS: ${SHUTTERFLOW_CUSTOM_DOMAINS_USER_IDS:-}
      # Hosted storage (shutterflow 0040): per-device B2 keys come from the key broker below; this
      # server holds only the request-signing secret. HOSTED_STORAGE_USER_IDS is the entitlement
      # allowlist (1Password: it names user ids); empty turns the storage routes off (403).
      BROKER_URL: http://shutterflow-key-broker:4300
      BROKER_HMAC_SECRET: ${SHUTTERFLOW_BROKER_HMAC_SECRET}
      HOSTED_STORAGE_USER_IDS: ${SHUTTERFLOW_HOSTED_STORAGE_USER_IDS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: shutterflow-share
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4100/health"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shutterflow.rule=Host(`shutterflow.app`)"
      - "traefik.http.routers.shutterflow.entrypoints=websecure"
      - "traefik.http.routers.shutterflow.tls.certresolver=letsencrypt"
      # Second zone: its own wildcard cert via DNS-01 (the static tls.domains covers DOMAIN only).
      - "traefik.http.routers.shutterflow.tls.domains[0].main=shutterflow.app"
      - "traefik.http.routers.shutterflow.tls.domains[0].sans[0]=*.shutterflow.app"
      - "traefik.http.routers.shutterflow.middlewares=security-headers@file"
      # Paths that carry secrets in the URL get their own router with Traefik's tracing and access
      # log off — Traefik records url.path/url.full/url.query and has no per-router redaction:
      # share links (bearer token in the path, 0019; `/share/<slug>-<key>` is the canonical form, 0024),
      # better-auth (OAuth callback code + state)
      # and desktop SSO (state, code_challenge). The share server's own spans redact them
      # (apps/share telemetry), so these requests are still traced, just not by Traefik.
      - "traefik.http.routers.shutterflow-links.rule=Host(`shutterflow.app`) && (PathPrefix(`/share/`) || PathPrefix(`/s/`) || PathPrefix(`/api/v1/public/shares/`) || PathPrefix(`/api/auth/`) || PathPrefix(`/api/v1/desktop/sso/`))"
      - "traefik.http.routers.shutterflow-links.priority=100"
      - "traefik.http.routers.shutterflow-links.entrypoints=websecure"
      - "traefik.http.routers.shutterflow-links.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shutterflow-links.middlewares=security-headers@file"
      - "traefik.http.routers.shutterflow-links.service=shutterflow"
      - "traefik.http.routers.shutterflow-links.observability.tracing=false"
      - "traefik.http.routers.shutterflow-links.observability.accesslogs=false"
      - "traefik.http.routers.shutterflow.service=shutterflow"
      # Custom domains (shutterflow 0037), the owner's portfolio host: the verification probe only,
      # so "Check now" can reach the share server while photo-gallery still serves the site.
      # Tracing and access logs off: 0037 keeps custom hostnames out of telemetry.
      - "traefik.http.routers.shutterflow-custom-probe.rule=Host(`photos.${DOMAIN}`) && PathPrefix(`/.well-known/shutterflow/`)"
      - "traefik.http.routers.shutterflow-custom-probe.priority=300"
      - "traefik.http.routers.shutterflow-custom-probe.entrypoints=websecure"
      - "traefik.http.routers.shutterflow-custom-probe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shutterflow-custom-probe.middlewares=security-headers@file"
      - "traefik.http.routers.shutterflow-custom-probe.service=shutterflow"
      - "traefik.http.routers.shutterflow-custom-probe.observability.tracing=false"
      - "traefik.http.routers.shutterflow-custom-probe.observability.accesslogs=false"
      - "traefik.http.services.shutterflow.loadbalancer.server.port=4100"
      - "traefik.http.services.shutterflow.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.shutterflow.loadbalancer.healthcheck.interval=5s"
      # Managed by RollHook — Watchtower must not interfere.
      - "com.centurylinklabs.watchtower.enable=false"
      # OIDC deploy authorization — only this GitHub repo can trigger deploys.
      - "rollhook.allowed_repos=jkrumm/shutterflow"
    networks:
      - proxy
      - postgres-net
      - monitoring-net
      - shutterflow-broker
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # shutterflow-imgproxy — serves shared photos straight from the synced Finals in
  # shutterflow/prod/masters/ (shutterflow 0042, deploy/image-serving.md). URLs are SIGNED: the
  # share server builds every URL from a fixed option allowlist and signs it. Every variant is a
  # fresh encode with metadata stripped by the configuration below; an edge rule on the router
  # refuses the options that could pass source bytes or metadata through.
  # ---------------------------------------------------------------------------
  shutterflow-imgproxy:
    # Exact pin, the tag shutterflow's dev service uses: an imgproxy upgrade is a deploy the
    # master-serving canary re-checks (0042 safety 5), never a silent watchtower bump.
    image: ghcr.io/imgproxy/imgproxy:v4.0.18
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_WORKERS: "4"
      IMGPROXY_KEY: ${SHUTTERFLOW_IMGPROXY_KEY}
      IMGPROXY_SALT: ${SHUTTERFLOW_IMGPROXY_SALT}

      # --- S3 source (B2) — key shutterflow-prod-masters-imgproxy: readFiles ONLY, prefix-locked
      # to shutterflow/prod/masters/ (op://vps/shutterflow-imgproxy). Only this container sees it;
      # the share server holds no masters key (shutterflow 0018), it only signs URLs.
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_REGION: ${SHUTTERFLOW_B2_REGION}
      IMGPROXY_S3_ENDPOINT: ${SHUTTERFLOW_B2_ENDPOINT}
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${SHUTTERFLOW_IMGPROXY_B2_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SHUTTERFLOW_IMGPROXY_B2_APP_KEY}
      # Second layer only — the B2 key's own name prefix is the authoritative boundary.
      IMGPROXY_ALLOWED_SOURCES: "s3://${SHUTTERFLOW_B2_BUCKET}/shutterflow/prod/masters/"
      IMGPROXY_S3_ALLOWED_BUCKETS: ${SHUTTERFLOW_B2_BUCKET}
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: "false"

      # --- Masters are never served as they are (shutterflow 0042 safety 1). Set explicitly so a
      # default change cannot flip them; the canary proves the result after every deploy.
      IMGPROXY_STRIP_METADATA: "true"          # EXIF/IPTC/XMP: GPS, maker notes, the embedded original
      IMGPROXY_KEEP_COPYRIGHT: "false"         # nothing survives: "true" left an empty XMP/IPTC skeleton
      IMGPROXY_STRIP_COLOR_PROFILE: "true"     # convert to sRGB, drop the ICC profile
      IMGPROXY_AUTO_ROTATE: "true"             # bake the orientation before the tag is dropped
      IMGPROXY_SKIP_PROCESSING_FORMATS: ""     # every source is re-encoded, none passed through
      IMGPROXY_ALLOW_SECURITY_OPTIONS: "false" # a URL cannot raise the source limits
      # Exactly the share server's URL-builder allowlist (apps/share image-urls ALLOWED_OPTIONS):
      # anything else (raw, skip_processing, strip_metadata, …) is refused, signed or not.
      IMGPROXY_ALLOWED_PROCESSING_OPTIONS: "rs,s,q,f,att,fn,cb,exp"

      # --- Caching: signed URLs expire after 1h (0019), so renditions are cached no longer —
      # a revoked share's images die with the signature, not a year later.
      IMGPROXY_TTL: "3600"
      IMGPROXY_CACHE_CONTROL_PASSTHROUGH: "false"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"

      # --- Observability — v4 still needs the ENABLE flags next to the OTEL_* vars.
      IMGPROXY_OPEN_TELEMETRY_ENABLE: "true"
      IMGPROXY_OPEN_TELEMETRY_ENABLE_METRICS: "true"
      IMGPROXY_OPEN_TELEMETRY_ENABLE_LOGS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: shutterflow-imgproxy

      # --- Source limits: masters are full Finals (26 MP X-T4 today; 120 MP leaves room for any
      # 100 MP-class body). 50 MiB covers the largest synced Final (~43 MB with a baked original).
      IMGPROXY_MAX_SRC_RESOLUTION: "120"
      IMGPROXY_MAX_SRC_FILE_SIZE: "52428800"
    healthcheck:
      # Liveness only (see apps/imgproxy/compose.yml) — B2 reachability shows in the OTLP errors.
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Edge rule (shutterflow 0042 safety 3): a path carrying an option that could keep source
      # data or lift a limit matches NO router, so Traefik answers its own 404 and imgproxy never
      # sees it (defence in depth should the signing key leak). `%3A` counts as an option end
      # because imgproxy decodes it to `:`. `$$` is compose-escaped `$`.
      - "traefik.http.routers.shutterflow-cdn.rule=Host(`cdn.shutterflow.app`) && !PathRegexp(`/(raw|skip_processing|skp|strip_metadata|sm|keep_copyright|kcr|max_src_resolution|msr)(:|%3[Aa]|/|$$)`)"
      - "traefik.http.routers.shutterflow-cdn.priority=100"
      - "traefik.http.routers.shutterflow-cdn.entrypoints=websecure"
      - "traefik.http.routers.shutterflow-cdn.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shutterflow-cdn.tls.domains[0].main=shutterflow.app"
      - "traefik.http.routers.shutterflow-cdn.tls.domains[0].sans[0]=*.shutterflow.app"
      - "traefik.http.routers.shutterflow-cdn.middlewares=security-headers@file"
      - "traefik.http.services.shutterflow-cdn.loadbalancer.server.port=8080"
      - "traefik.http.services.shutterflow-cdn.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.shutterflow-cdn.loadbalancer.healthcheck.interval=30s"
    networks:
      - proxy
      - monitoring-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # shutterflow-key-broker — mints each signed-in desktop a B2 key for its own account prefix
  # (shutterflow 0040, deploy/hosted-storage.md). Its B2 key can create and delete keys and files
  # account-wide, so: no published port, no Traefik router, reachable only from the share server
  # over the internal network, and its secrets come from their own env file
  # (key-broker.env, op://vps/shutterflow-key-broker only — never the share server's .env).
  # Not RollHook-managed: built by `make shutterflow-key-broker-image TAG=<sha>`, pinned here.
  # ---------------------------------------------------------------------------
  shutterflow-key-broker:
    image: rollhook.jkrumm.com/shutterflow-key-broker:9c78d2d11a58e8240f0c9bc700fccd0adb33048e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    env_file:
      - key-broker.env
    environment:
      STORAGE_ENV: prod
      # The nightly usage report, HMAC-signed, over the internal network.
      USAGE_REPORT_URL: http://shutterflow-share:4100/api/v1/internal/storage/usage
    volumes:
      - shutterflow-key-broker-state:/var/lib/key-broker
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - shutterflow-broker
      - shutterflow-broker-egress
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
