# ClickStack OTel Collector — merged with the bundled base config at startup.
# Loaded via CUSTOM_OTELCOL_CONFIG_FILE env var (see compose.monitoring.yml).
#
# Two jobs:
#
# 1. A SECOND OTLP receiver on :4319 without auth.
#    - The base config enforces bearertokenauth on the :4318 (HTTP) and :4317
#      (gRPC) OTLP receivers, and the base is locked (OpAMP-managed — no env
#      to disable, no override).
#    - Internal services on monitoring-net (traefik, etc.) need to export OTLP,
#      but Traefik 3.x cannot reliably inject env-var values into its
#      static-YAML auth headers (traefik-helm-chart#1361, unfixed).
#    - Solution: add a second receiver instance on :4319 without auth. Bind
#      only to the docker bridge and the host's loopback (compose publishes 127.0.0.1:4319 for host-agent,
#      which runs in the host network namespace) — never a routable interface, never exposed via
#      Traefik — so the trust boundary is the host, not the receiver.
#    Browser SDK ingress (via Traefik → clickstack:4318) still goes through the
#    authed path, since the browser embeds the ingestion key anyway. Argo
#    (argo-api, now on the mini) also exports over the authed tier, not :4319.
#
# 2. Normalisation of resource attributes on EVERY pipeline (the telemetry
#    contract, docs/observability.md → "Telemetry contract"):
#    - deployment.environment.name is exactly `prod` or `dev`. Missing → copied
#      from the deprecated deployment.environment; production → prod; any other
#      value (development, test, staging, an app version) → dev: a sender that is
#      not saying `prod` is not prod. Both keys are normalised.
#    - host.name is a machine (vps, mini, ...), never a container ID. On the
#      internal :4319 receiver everything runs on this VPS, so host.name is set
#      to it (a container-ID-looking value moves to container.id). On the authed
#      tier a container-ID-looking host.name moves to container.id and host.name
#      is dropped; the collector's own metrics (otelcol-hyperdx, clickhouse)
#      are on this VPS and get host.name=vps.
#
# How the merge treats pipelines (verified on the live collector, 0.155):
#   - The base config declares `processors:` lists for traces, metrics,
#     logs/out-default and logs/out-rrweb; the OpAMP remote config sets only
#     receivers and exporters on them. A `processors:` list here REPLACES the
#     base list (upstream design: ClickStack PR 2351) — so the lists below
#     repeat the base ones plus the normalisation. Re-read them against
#     /etc/otelcol-contrib/config.yaml on every ClickStack bump.
#   - receivers/exporters of base pipelines cannot be changed (the remote
#     config wins), so :4319 gets parallel pipelines (*/internal).
#   - logs/in has no processors in the base, so one is added there: every
#     authed log, session replay included, is normalised before routing.
#
# Reading the effective result:
#   docker exec clickstack cat /etc/otel/supervisor-data/effective.yaml

receivers:
  otlp/internal:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        include_metadata: true

processors:
  # Environment: both keys, all signals. error_mode ignore = a statement that
  # does not apply to a resource (attribute absent) is skipped.
  transform/env:
    error_mode: ignore
    trace_statements: &env_statements
      - context: resource
        statements:
          - set(resource.attributes["deployment.environment"], "prod") where resource.attributes["deployment.environment"] == "production"
          - set(resource.attributes["deployment.environment"], "dev") where resource.attributes["deployment.environment"] != nil and resource.attributes["deployment.environment"] != "prod" and resource.attributes["deployment.environment"] != "dev"
          - set(resource.attributes["deployment.environment.name"], "prod") where resource.attributes["deployment.environment.name"] == "production"
          - set(resource.attributes["deployment.environment.name"], "dev") where resource.attributes["deployment.environment.name"] != nil and resource.attributes["deployment.environment.name"] != "prod" and resource.attributes["deployment.environment.name"] != "dev"
          - set(resource.attributes["deployment.environment.name"], resource.attributes["deployment.environment"]) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["deployment.environment"] != nil
    metric_statements: *env_statements
    log_statements: *env_statements

  # Internal tier (:4319, docker bridge): every sender runs on this VPS. The
  # name comes from the env so the dev stack (compose.dev.yml) can say `mini`.
  transform/internal:
    error_mode: ignore
    trace_statements: &internal_statements
      - context: resource
        statements:
          - set(resource.attributes["container.id"], resource.attributes["host.name"]) where resource.attributes["container.id"] == nil and IsMatch(resource.attributes["host.name"], "^[0-9a-f]{12,64}$")
          - set(resource.attributes["host.name"], "${env:TELEMETRY_HOST_NAME:-vps}")
    metric_statements: *internal_statements
    log_statements: *internal_statements

  # Authed tier (:4318/:4317 and the collector's own scrape): senders are on any
  # machine, so a container ID is only moved aside, not replaced. The two
  # services below are this ClickStack's own telemetry (the collector's metrics
  # and the ClickHouse scrape); nothing sets their resource, so it is set here.
  transform/authed:
    error_mode: ignore
    trace_statements: &authed_statements
      - context: resource
        statements:
          - set(resource.attributes["container.id"], resource.attributes["host.name"]) where resource.attributes["container.id"] == nil and IsMatch(resource.attributes["host.name"], "^[0-9a-f]{12,64}$")
          - delete_key(resource.attributes, "host.name") where IsMatch(resource.attributes["host.name"], "^[0-9a-f]{12,64}$")
          - set(resource.attributes["host.name"], "${env:TELEMETRY_HOST_NAME:-vps}") where resource.attributes["service.name"] == "otelcol-hyperdx" or resource.attributes["service.name"] == "clickhouse"
          - set(resource.attributes["service.namespace"], "vps") where resource.attributes["service.namespace"] == nil and (resource.attributes["service.name"] == "otelcol-hyperdx" or resource.attributes["service.name"] == "clickhouse")
          - set(resource.attributes["deployment.environment.name"], "${env:TELEMETRY_ENVIRONMENT:-prod}") where resource.attributes["deployment.environment.name"] == nil and (resource.attributes["service.name"] == "otelcol-hyperdx" or resource.attributes["service.name"] == "clickhouse")
    metric_statements: *authed_statements
    log_statements: *authed_statements

service:
  pipelines:
    # --- authed tier: the base pipelines, processors only (see header) ---
    traces:
      processors: [memory_limiter, transform/session_id, transform/env, transform/authed, batch]
    metrics:
      processors: [memory_limiter, transform/env, transform/authed, batch]
    logs/in:
      processors: [transform/env, transform/authed]

    # --- internal tier (:4319): parallel pipelines into the same exporters ---
    # ClickStack's merge cannot add a receiver to an EXISTING pipeline, so these
    # fan into the same clickhouse exporter / routing connector.
    traces/internal:
      receivers: [otlp/internal]
      processors: [memory_limiter, transform/env, transform/internal, batch]
      exporters: [clickhouse]
    logs/in-internal:
      receivers: [otlp/internal]
      processors: [transform/env, transform/internal]
      exporters: [routing/logs]
    metrics/internal:
      receivers: [otlp/internal]
      processors: [memory_limiter, transform/env, transform/internal, batch]
      exporters: [clickhouse]
