## Traefik dynamic configuration — middlewares
## Applied via labels: traefik.http.routers.<name>.middlewares=rate-limit@file,security-headers@file

http:
  middlewares:

    # Rate limiting — per client, keyed on Cf-Connecting-Ip.
    # Built-in Traefik middleware, no external dependency.
    # Not the source IP: all public traffic arrives from the one cloudflared container,
    # so a per-IP bucket would be a single global bucket shared by every client.
    # Cloudflare overwrites Cf-Connecting-Ip at the edge; requests without it (tailnet)
    # share one bucket.
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # Security headers — HSTS + browser security hardening.
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # microphone=(self): own-origin only (still gated by the browser permission
        # prompt; cross-origin/embedded iframes stay blocked). Argo's voice input
        # (getUserMedia) needs it; camera/geolocation/payment stay fully disabled.
        permissionsPolicy: "camera=(), microphone=(self), geolocation=(), payment=()"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        customFrameOptionsValue: "SAMEORIGIN"

    # Tailscale-only — restrict access to Tailscale CGNAT range (100.64.0.0/10).
    # NOTE: Ineffective when Traefik sits behind Docker published ports — Docker NAT
    # rewrites the source IP to the bridge gateway (172.x.x.x), so the check always fails.
    # Internal dashboards (traefik.DOMAIN, hyperdx.DOMAIN) use DNS-based access control
    # instead: DNS-only A records → Tailscale IP make them unreachable from public internet.
    # This middleware is kept as a reference; only use it when Traefik receives real client IPs
    # (e.g., host network mode or trusted proxy forwarding).
    tailscale-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
