## Traefik v3 — Static Configuration
## Deploy: op run --env-file=.env.tpl -- docker compose up -d
##
## NOTE: This file does NOT support ${ENV_VAR} substitution.
## Domain-specific config (wildcard cert domains, ACME email) is handled via:
##   - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL env var in compose.networking.yml
##   - tls.domains labels on the dashboard router in compose.networking.yml

api:
  dashboard: true
  insecure: false

log:
  level: INFO

accessLog:
  bufferingSize: 100

entryPoints:
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        # Wildcard domain is requested via tls.domains labels on the dashboard router.
        # See compose.networking.yml: traefik.http.routers.dashboard.tls.domains[0].*
      middlewares:
        - security-headers@file

certificatesResolvers:
  letsencrypt:
    acme:
      # email set via TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL env var in compose.networking.yml
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

# OTLP export to ClickStack via the trusted-internal port (no auth).
#
# Why :4319 not :4318:
#   ClickStack's bundled OTel collector enforces bearertokenauth on :4318 and
#   the auth is locked (OpAMP base config, no env to disable). Traefik 3.x has
#   two known issues that prevent us from sending the auth header reliably:
#     1. ${VAR} substitution is not performed in static-YAML header values
#     2. TRAEFIK_TRACING_OTLP_HTTP_HEADERS_authorization env var doesn't
#        populate the headers map at config-load time
#        (traefik-helm-chart#1361 — acknowledged bug, unfixed in 3.6).
#   Rather than templating this file at deploy, we add a second OTLP receiver
#   on :4319 inside ClickStack (see clickstack/otel-custom.yaml) without auth,
#   bound only to the docker bridge. Traefik → clickstack:4319 stays inside
#   monitoring-net; never published to host, never routed via Traefik itself.
tracing:
  otlp:
    http:
      endpoint: http://clickstack:4319
  serviceName: traefik
  sampleRate: 0.1

metrics:
  otlp:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    pushInterval: 30s
    http:
      endpoint: http://clickstack:4319
