---
# Local dev infra — Postgres, Valkey, MariaDB, ClickStack for local app development.
# Injected via $(OP_RUN_DEV) (--env-file=.env.dev.tpl) in the Makefile — the narrow
# dev template, NOT the prod .env.tpl. See that file's header.
# Usage: make up (with ENV=dev in .env)
#        make postgres-setup (provisions schemas/users)
#
# EVERY published port binds 127.0.0.1 explicitly. Docker's default is 0.0.0.0,
# which on the Mac mini — the always-on dev host — means the tailnet interface too,
# leaving a Tailscale ACL as the only thing between other machines and a Postgres
# superuser or an unauthenticated Valkey. That is the wrong layer for it: an ACL is
# a shared, remotely-editable document covering the whole tailnet, and the current
# grant (tcp:7700-7799 between Macs) protects these ports only by not mentioning
# them. Every other dev container on the mini already binds loopback.
#
# Apps reach these over localhost; the HyperDX UI is reached through Caddy
# (hyperdx.test locally, https://hyperdx.mini.jkrumm.com on the tailnet), which
# proxies to localhost and so is unaffected. If something later genuinely needs
# cross-machine DB access, that is a deliberate port grant plus an explicit bind
# change here — not a default nobody chose.

services:

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:9
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-dev-data:/data

  # FPP MariaDB — dev only (no TLS). Host port 13306 to avoid collisions with
  # other local MySQL instances (e.g. work projects on 3306). Prod compose at
  # apps/fpp/compose.yml binds 33306 publicly for Vercel.
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DB}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mariadb-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClickStack — all-in-one observability (ClickHouse + OTel Collector + HyperDX UI + MongoDB).
  # UI: https://hyperdx.test (routed via dotfiles Caddyfile + dnsmasq)
  # Apps: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4319 (unauthed)
  # First visit → create admin account (persisted in volume).
  #
  # Mirrors the prod two-tier OTLP setup (see vps/docs/observability.md):
  #   :4317/:4318 — bundled receivers, bearertokenauth enforced
  #   :4319       — custom unauthed receiver added via otel-custom.yaml,
  #                 same file as prod monitoring stack uses.
  # Local apps + the Vite proxy point at :4319 so dev needs no ingestion key.
  # ---------------------------------------------------------------------------
  clickstack:
    # On demand only (~4 GB resident): `make clickstack-up` / `clickstack-down`.
    # The profile keeps it out of a plain `make up`.
    profiles: [observability]
    image: clickhouse/clickstack-all-in-one:latest
    container_name: clickstack
    ports:
      - "127.0.0.1:7707:8080"   # HyperDX UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC (authed)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (authed) — kept for parity testing
      - "127.0.0.1:4319:4319"   # OTLP HTTP (unauthed, dev default)
      - "127.0.0.1:8123:8123"  # ClickHouse HTTP — loopback-only for direct OTEL queries
                               # from the host (used by /otel skill --transport http).
    volumes:
      - clickstack-db:/data/db
      - clickstack-ch-data:/var/lib/clickhouse
      - clickstack-ch-logs:/var/log/clickhouse-server
      - ./clickstack/otel-custom.yaml:/etc/otelcol-contrib/custom.config.yaml:ro
      - ./clickstack/users-dev.xml:/etc/clickhouse-server/users.d/dev-default.xml:ro
    environment:
      HYPERDX_LOG_LEVEL: debug
      USAGE_STATS_ENABLED: "false"
      FRONTEND_URL: https://hyperdx.test
      CUSTOM_OTELCOL_CONFIG_FILE: /etc/otelcol-contrib/custom.config.yaml

volumes:
  postgres-dev-data:
  valkey-dev-data:
  mariadb-dev-data:
  clickstack-db:
  clickstack-ch-data:
  clickstack-ch-logs:
