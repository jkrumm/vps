---
# Monitoring stack
# Deploy: op run --env-file=.env.tpl -- docker compose -f compose.monitoring.yml up -d
# Requires networking + infra stacks to be running first.

volumes:
  clickstack-db:
  clickstack-ch-data:
  clickstack-ch-logs:

networks:
  proxy:
    external: true
  postgres-net:
    external: true
  monitoring-net:
    external: true
  socket-proxy-watchtower-net:
    driver: bridge
    internal: true
  socket-proxy-monitoring-net:
    driver: bridge
    internal: true
  watchtower-egress:
    driver: bridge  # Internet access for Slack webhook notifications

services:

  # ---------------------------------------------------------------------------
  # Docker socket proxy — dedicated instance for Watchtower.
  # POST=1 is required: Watchtower must stop, pull, and recreate containers.
  # Isolated on its own internal network so Traefik's proxy stays read-only.
  # ---------------------------------------------------------------------------
  socket-proxy-watchtower:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy-watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      EVENTS: 1
      PING: 1
      VERSION: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1   # required for Watchtower to connect recreated containers to their networks
      POST: 1       # write access — required for Watchtower to pull and recreate containers
      DELETE: 1     # required for Watchtower to remove old containers before recreating
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-watchtower-net
    # Probes the docker socket backend through HAProxy (PING=1). If the daemon
    # is restarted and this container keeps a stale socket handle, /_ping starts
    # returning 503 and the container flips to "unhealthy" instead of failing
    # silently at the next 04:00 Watchtower run.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2375/_ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Watchtower — auto-updates containers and sends Slack notifications.
  # Connects to Docker via socket proxy (TCP). Postgres and Valkey excluded.
  # Notifications only at warn level (failures, not every successful update).
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    depends_on:
      - socket-proxy-watchtower
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - socket-proxy-watchtower-net
      - watchtower-egress
    environment:
      # Connect to Docker via proxy (no direct docker.sock mount needed)
      DOCKER_HOST: tcp://socket-proxy-watchtower:2375
      DOCKER_API_VERSION: "1.44"
      # Slack via shoutrrr — webhook URL from 1Password common/slack
      WATCHTOWER_NOTIFICATION_URL: "${SLACK_WATCHTOWER_URL}"
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_WARN_ON_HEAD_FAILURE: never
      # Remove old images after successful update
      WATCHTOWER_CLEANUP: "true"
      # Run daily at 04:00 (6-field cron: seconds minutes hours day month weekday)
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Docker socket proxy — read-only, for Dozzle and Beszel agent.
  # Grants only the endpoints each needs: container list, logs, stats.
  # POST=0 ensures no write operations are possible.
  # ---------------------------------------------------------------------------
  socket-proxy-monitoring:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy-monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      CONTAINERS: 1
      LOGS: 1
      STATS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-monitoring-net
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # ClickStack — all-in-one observability (ClickHouse + OTel Collector + HyperDX UI + MongoDB).
  # Replaces standalone OTel Collector + SigNoz. Apps send OTLP to clickstack:4318.
  # UI accessible via Traefik at clickstack.DOMAIN (Tailscale-only).
  # Watchtower auto-updates the full stack image.
  # ---------------------------------------------------------------------------
  clickstack:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: clickstack
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      HYPERDX_LOG_LEVEL: info
      USAGE_STATS_ENABLED: "false"
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
      FRONTEND_URL: https://hyperdx.${DOMAIN}
      # Add a second OTLP HTTP receiver on :4319 without auth, merged into the
      # base collector pipelines. Bound to the docker bridge only — never
      # published to host, never routed via Traefik. Trusted-internal services
      # (traefik, future homelab agents) hit this; browser SDK, any public
      # ingress and argo-api (now on the mini) use the authed tier. See
      # clickstack/otel-custom.yaml for the merged-config rationale.
      CUSTOM_OTELCOL_CONFIG_FILE: /etc/otelcol-contrib/custom.config.yaml
    volumes:
      - clickstack-db:/data/db
      - clickstack-ch-data:/var/lib/clickhouse
      - clickstack-ch-logs:/var/log/clickhouse-server
      - ./clickstack/otel-custom.yaml:/etc/otelcol-contrib/custom.config.yaml:ro
      - ./clickstack/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
    networks:
      - monitoring-net
      - proxy
    # No host ports for OTel — apps reach clickstack:4317/4318 via monitoring-net,
    # browser SDKs reach otel.DOMAIN via Cloudflare → Traefik.
    # Health check exposed on Tailscale for Uptime Kuma monitoring.
    ports:
      - "${VPS_TAILSCALE_IP:?VPS_TAILSCALE_IP must be set}:13133:13133"   # OTel health check — Tailscale only
    labels:
      # HyperDX UI — Tailscale-only via DNS (A record → Tailscale IP, DNS-only/grey cloud).
      # Docker NAT rewrites source IPs, so ipAllowList is ineffective here.
      # CGNAT routing (100.x.x.x) is unreachable from public internet — DNS is the access control.
      - "traefik.enable=true"
      - "traefik.http.routers.clickstack.rule=Host(`hyperdx.${DOMAIN}`)"
      - "traefik.http.routers.clickstack.entrypoints=websecure"
      - "traefik.http.routers.clickstack.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clickstack.service=clickstack"
      - "traefik.http.services.clickstack.loadbalancer.server.port=8080"
      # OTel HTTP — public (browser SDKs, session replay, external instrumentation)
      - "traefik.http.routers.clickstack-otel.rule=Host(`otel.${DOMAIN}`)"
      - "traefik.http.routers.clickstack-otel.entrypoints=websecure"
      - "traefik.http.routers.clickstack-otel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clickstack-otel.service=clickstack-otel"
      - "traefik.http.services.clickstack-otel.loadbalancer.server.port=4318"
      - "traefik.http.routers.clickstack-otel.middlewares=rate-limit@file,security-headers@file"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Beszel agent — sends server metrics to Beszel hub on homelab.
  # Connects to hub via Tailscale IP. Key generated in Beszel hub UI.
  # ---------------------------------------------------------------------------
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    depends_on:
      - socket-proxy-monitoring
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    environment:
      KEY: ${BESZEL_AGENT_KEY}
      DOCKER_HOST: tcp://socket-proxy-monitoring:2375
      # Agent listens on :45876 (Beszel default), accessible via Tailscale only
    ports:
      - "${VPS_TAILSCALE_IP:?VPS_TAILSCALE_IP must be set}:45876:45876"   # Tailscale only
    networks:
      - monitoring-net
      - socket-proxy-monitoring-net
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Dozzle — log viewer running in agent mode.
  # Hub on homelab discovers this agent via Tailscale IP.
  # ---------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    depends_on:
      - socket-proxy-monitoring
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    command: agent
    environment:
      DOZZLE_HOSTNAME: vps
      DOCKER_HOST: tcp://socket-proxy-monitoring:2375
    networks:
      - monitoring-net
      - socket-proxy-monitoring-net
    ports:
      - "${VPS_TAILSCALE_IP:?VPS_TAILSCALE_IP must be set}:7007:7007"   # Tailscale only
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Umami — privacy-focused web analytics.
  # Schema: umami (within main Postgres database). Watchtower auto-updates.
  # ---------------------------------------------------------------------------
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      # ?schema=umami tells Prisma to use the umami schema, not public
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      TRACKER_SCRIPT_NAME: p.js
      COLLECT_API_ENDPOINT: /api/p
      # Sites that proxy the tracker through their own domain (Brave Shields bypass, e.g.
      # sy-serendipity on Netlify) arrive with cf-connecting-ip = the proxy's IP. Netlify passes
      # the visitor in x-nf-client-connection-ip; when the header is absent Umami falls back to
      # its default chain (cf-connecting-ip), so direct-loading sites are unaffected.
      CLIENT_IP_HEADER: x-nf-client-connection-ip
      # Geo from the bundled GeoLite2 DB on the resolved IP, not Cloudflare's cf-ipcountry
      # (which would name the proxy's country for proxied sites).
      SKIP_LOCATION_HEADERS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`umami.${DOMAIN}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.umami.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.umami.loadbalancer.healthcheck.path=/api/heartbeat"
      - "traefik.http.services.umami.loadbalancer.healthcheck.interval=5s"
    networks:
      - proxy
      - postgres-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
