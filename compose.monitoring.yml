---
# Monitoring stack
# Deploy: op run --env-file=.env.tpl -- docker compose -f compose.monitoring.yml up -d
# Requires networking + infra stacks to be running first.

volumes:
  clickstack-db:
  clickstack-ch-data:
  clickstack-ch-logs:
  host-agent-queue:   # persistent exporter queue of host-agent
  host-probe-queue:   # persistent exporter queue of host-probe

networks:
  proxy:
    external: true
  postgres-net:
    external: true
  monitoring-net:
    external: true
  socket-proxy-watchtower-net:
    driver: bridge
    internal: true
  socket-proxy-monitoring-net:
    driver: bridge
    internal: true
  watchtower-egress:
    driver: bridge  # Outbound access for the ntfy notifications

services:

  # ---------------------------------------------------------------------------
  # Docker socket proxy — dedicated instance for Watchtower.
  # POST=1 is required: Watchtower must stop, pull, and recreate containers.
  # Isolated on its own internal network so Traefik's proxy stays read-only.
  # ---------------------------------------------------------------------------
  socket-proxy-watchtower:
    image: tecnativa/docker-socket-proxy:lts@sha256:fd989c12c74edb8424f53f31a2054459f286967c93e113e91ea95432f066493b
    container_name: socket-proxy-watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      EVENTS: 1
      PING: 1
      VERSION: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1   # required for Watchtower to connect recreated containers to their networks
      POST: 1       # write access — required for Watchtower to pull and recreate containers
      DELETE: 1     # required for Watchtower to remove old containers before recreating
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-watchtower-net
    # Probes the docker socket backend through HAProxy (PING=1). If the daemon
    # is restarted and this container keeps a stale socket handle, /_ping starts
    # returning 503 and the container flips to "unhealthy" instead of failing
    # silently at the next 04:00 Watchtower run.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2375/_ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Never auto-updated: Watchtower recreating a socket proxy drops Traefik's docker
    # provider (every route 404s) and, for the watchtower proxy, strands the whole
    # sweep (incident 2026-11-17). Bump the tag@digest by hand, then `make deploy`.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Watchtower — auto-updates containers and sends ntfy notifications.
  # Connects to Docker via socket proxy (TCP). Postgres and Valkey excluded.
  # Notifications only at warn level (failures, not every successful update).
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:1.24.0
    container_name: watchtower
    restart: unless-stopped
    depends_on:
      - socket-proxy-watchtower
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - socket-proxy-watchtower-net
      - watchtower-egress
    environment:
      # Connect to Docker via proxy (no direct docker.sock mount needed)
      DOCKER_HOST: tcp://socket-proxy-watchtower:2375
      # ntfy topic `updates` via shoutrrr. Empty user + access token = Basic auth, which
      # ntfy accepts. Host is ntfy.${DOMAIN} (tailnet-resolving), token from 1Password
      # common/ntfy/TOKEN.
      WATCHTOWER_NOTIFICATION_URL: "ntfy://:${NTFY_TOKEN}@ntfy.${DOMAIN}/updates?scheme=https&title=Watchtower&tags=whale"
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_WARN_ON_HEAD_FAILURE: never
      # Remove old images after successful update
      WATCHTOWER_CLEANUP: "true"
      # Run daily at 04:00 (6-field cron: seconds minutes hours day month weekday)
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Docker socket proxy — read-only, for Dozzle and host-probe.
  # Grants only the endpoints each needs: container list, logs, stats.
  # POST=0 ensures no write operations are possible.
  # ---------------------------------------------------------------------------
  socket-proxy-monitoring:
    image: tecnativa/docker-socket-proxy:lts@sha256:fd989c12c74edb8424f53f31a2054459f286967c93e113e91ea95432f066493b
    container_name: socket-proxy-monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      CONTAINERS: 1
      LOGS: 1
      STATS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-monitoring-net
    # Never auto-updated: Watchtower recreating a socket proxy drops Traefik's docker
    # provider (every route 404s) and, for the watchtower proxy, strands the whole
    # sweep (incident 2026-11-17). Bump the tag@digest by hand, then `make deploy`.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # ClickStack — all-in-one observability (ClickHouse + OTel Collector + HyperDX UI + MongoDB).
  # Replaces standalone OTel Collector + SigNoz. Apps on monitoring-net send OTLP to clickstack:4319 (unauthed, docker bridge).
  # UI accessible via Traefik at hyperdx.DOMAIN (Tailscale-only).
  # Pinned to an exact version and excluded from Watchtower: a ClickHouse/HyperDX/Mongo
  # bundle upgrade can migrate on-disk data, so bump the tag manually (backup first).
  # ---------------------------------------------------------------------------
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.45.0
    container_name: clickstack
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    environment:
      HYPERDX_LOG_LEVEL: info
      USAGE_STATS_ENABLED: "false"
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
      FRONTEND_URL: https://hyperdx.${DOMAIN}
      # Add a second OTLP HTTP receiver on :4319 without auth, merged into the
      # base collector pipelines. On the docker bridge, plus the host's loopback
      # only (127.0.0.1:4319, for host-agent): never on a routable interface, never routed via Traefik. Trusted-internal services
      # (traefik, future homelab agents) hit this; browser SDK, any public
      # ingress and argo-api (now on the mini) use the authed tier. See
      # clickstack/otel-custom.yaml for the merged-config rationale.
      CUSTOM_OTELCOL_CONFIG_FILE: /etc/otelcol-contrib/custom.config.yaml
      # Retention tiers (docs/observability.md → Retention). Read by ClickStack's schema
      # migration when it CREATES a table; existing tables keep their TTL until
      # ALTER TABLE ... MODIFY TTL (the runbook there). Go durations or `<n>d`.
      # What the collector gateway stamps on :4319 telemetry and on its own (clickstack/otel-custom.yaml).
      TELEMETRY_HOST_NAME: vps
      TELEMETRY_ENVIRONMENT: prod
      TELEMETRY_VERSION: 2.45.0   # the ClickStack tag above; the clickhouse scrape carries no version of its own
      # HyperDX >= 2.45 refuses webhook URLs that resolve to a private address; the Factory door is the mini's
      # tailnet name (mapped to its CGNAT IP in extra_hosts below), so it is allowlisted by name. Without this every
      # alert fails with WEBHOOK_ERROR and nothing reaches the door.
      WEBHOOK_HOSTNAME_ALLOWLIST: ${MINI_TAILNET_HOST:-mini.invalid}
      HYPERDX_OTEL_EXPORTER_LOGS_TTL: 30d
      HYPERDX_OTEL_EXPORTER_TRACES_TTL: 30d
      HYPERDX_OTEL_EXPORTER_SESSIONS_TTL: 14d    # session replay: the largest table
      HYPERDX_OTEL_EXPORTER_METRICS_TTL: 400d    # host and line-quality history outlives 30 days
      # sha256 hex of the argo_ro password (clickstack/argo-ro-user.xml). `:?` stops compose before a recreate,
      # because ClickHouse refuses to start on an empty hash.
      ARGO_RO_PASSWORD_SHA256: ${ARGO_RO_PASSWORD_SHA256:?ARGO_RO_PASSWORD_SHA256 must be set}
    volumes:
      - clickstack-db:/data/db
      - clickstack-ch-data:/var/lib/clickhouse
      - clickstack-ch-logs:/var/log/clickhouse-server
      - ./clickstack/otel-custom.yaml:/etc/otelcol-contrib/custom.config.yaml:ro
      - ./clickstack/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
      - ./clickstack/argo-ro-user.xml:/etc/clickhouse-server/users.d/argo-ro.xml:ro
    # The factory door on the mini: this host does not resolve the mini's MagicDNS name, so the name is mapped here, and the
    # HyperDX webhook's TLS still validates against it. Both values live in the untracked ~/vps/.env, same as weatherorb's.
    extra_hosts:
      - "${MINI_TAILNET_HOST:-mini.invalid}:${MINI_TAILSCALE_IP:-192.0.2.1}"
    networks:
      - monitoring-net
      - proxy
    # No host ports for OTel — apps reach clickstack:4317/4318 via monitoring-net,
    # browser SDKs reach otel.DOMAIN via Cloudflare → Traefik.
    # Health check exposed on Tailscale for Uptime Kuma monitoring.
    ports:
      - "${VPS_TAILSCALE_IP:?VPS_TAILSCALE_IP must be set}:13133:13133"   # OTel health check — Tailscale only
      # The unauthed OTLP tier for host-agent, which runs in the host network namespace and cannot resolve
      # `clickstack`. Loopback only: reachable by processes on this host, never from the network.
      - "127.0.0.1:4319:4319"
      # ClickHouse HTTP for Argo's dashboards (read-only user argo_ro, clickstack/argo-ro-user.xml). Docker publishes
      # bypass ufw, so the bind address is the control: tailnet only, never routed via Traefik or the tunnel.
      - "${VPS_TAILSCALE_IP:?VPS_TAILSCALE_IP must be set}:8123:8123"   # ClickHouse HTTP — Tailscale only
    labels:
      # Watchtower: excluded from auto-updates — bump the pinned tag manually
      - "com.centurylinklabs.watchtower.enable=false"
      # HyperDX UI — Tailscale-only via DNS (A record → Tailscale IP, DNS-only/grey cloud).
      # Docker NAT rewrites source IPs, so ipAllowList is ineffective here.
      # CGNAT routing (100.x.x.x) is unreachable from public internet — DNS is the access control.
      - "traefik.enable=true"
      - "traefik.http.routers.clickstack.rule=Host(`hyperdx.${DOMAIN}`)"
      - "traefik.http.routers.clickstack.entrypoints=websecure"
      - "traefik.http.routers.clickstack.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clickstack.service=clickstack"
      - "traefik.http.services.clickstack.loadbalancer.server.port=8080"
      # OTel HTTP — public (browser SDKs, session replay, external instrumentation)
      - "traefik.http.routers.clickstack-otel.rule=Host(`otel.${DOMAIN}`)"
      - "traefik.http.routers.clickstack-otel.entrypoints=websecure"
      - "traefik.http.routers.clickstack-otel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clickstack-otel.service=clickstack-otel"
      - "traefik.http.services.clickstack-otel.loadbalancer.server.port=4318"
      - "traefik.http.routers.clickstack-otel.middlewares=rate-limit@file,security-headers@file"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # host-agent — host metrics (CPU, memory, load, swap, disk, filesystem, network) into ClickStack.
  # A slim OpenTelemetry Collector built from agent/manifest.yaml (agent/README.md). It runs in the HOST network
  # namespace because the network scraper reads /proc/net/dev, which shows the namespace of the reading process; the
  # host filesystem is mounted read-only for the other scrapers. Exports to the loopback OTLP port of clickstack.
  # The exporter queue is on a volume: samples survive a ClickStack restart and keep their original timestamps.
  # Built on the VPS by `make monitoring-up` (--build); never touched by Watchtower.
  # ---------------------------------------------------------------------------
  host-agent:
    build:
      context: ./agent
    image: host-agent:0.165.0
    container_name: host-agent
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    environment:
      AGENT_HOST_NAME: vps
      AGENT_ENVIRONMENT: prod
      AGENT_OTLP_ENDPOINT: http://127.0.0.1:4319
    volumes:
      - ./agent/config/host.yaml:/etc/host-agent/config.yaml:ro
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave
      - host-agent-queue:/var/lib/host-agent
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # host-probe — the same agent image, bridge network: container metrics through the read-only
  # socket-proxy-monitoring (never the raw socket) and the outside view (HTTP checks of the public sites,
  # ICMP to public resolvers). Unprivileged ICMP needs the ping_group_range Docker sets in a bridge container.
  # ---------------------------------------------------------------------------
  host-probe:
    build:
      context: ./agent
    image: host-agent:0.165.0
    container_name: host-probe
    restart: unless-stopped
    depends_on:
      - socket-proxy-monitoring
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    environment:
      AGENT_HOST_NAME: vps
      AGENT_ENVIRONMENT: prod
      AGENT_OTLP_ENDPOINT: http://clickstack:4319
      DOCKER_ENDPOINT: tcp://socket-proxy-monitoring:2375
    volumes:
      - ./agent/config/vps-probe.yaml:/etc/host-agent/config.yaml:ro
      - host-probe-queue:/var/lib/host-agent
    networks:
      - monitoring-net
      - socket-proxy-monitoring-net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Dozzle — log viewer running in agent mode.
  # Hub on homelab discovers this agent via Tailscale IP.
  # ---------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    depends_on:
      - socket-proxy-monitoring
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    command: agent
    environment:
      DOZZLE_HOSTNAME: vps
      DOCKER_HOST: tcp://socket-proxy-monitoring:2375
    networks:
      - monitoring-net
      - socket-proxy-monitoring-net
    ports:
      - "${VPS_TAILSCALE_IP:?VPS_TAILSCALE_IP must be set}:7007:7007"   # Tailscale only
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Umami — privacy-focused web analytics.
  # Schema: umami (within main Postgres database). Watchtower auto-updates.
  # ---------------------------------------------------------------------------
  umami:
    image: ghcr.io/umami-software/umami:3
    container_name: umami
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      # ?schema=umami tells Prisma to use the umami schema, not public
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      TRACKER_SCRIPT_NAME: p.js
      COLLECT_API_ENDPOINT: /api/p
      # Sites that proxy the tracker through their own domain (Brave Shields bypass, e.g.
      # sy-serendipity on Netlify) arrive with cf-connecting-ip = the proxy's IP. Netlify passes
      # the visitor in x-nf-client-connection-ip; when the header is absent Umami falls back to
      # its default chain (cf-connecting-ip), so direct-loading sites are unaffected.
      CLIENT_IP_HEADER: x-nf-client-connection-ip
      # Geo from the bundled GeoLite2 DB on the resolved IP, not Cloudflare's cf-ipcountry
      # (which would name the proxy's country for proxied sites).
      SKIP_LOCATION_HEADERS: "1"
      # Hops in front of Umami (cloudflared, Traefik: Docker bridge addresses). An address in
      # X-Forwarded-For / Forwarded that one of them wrote is skipped when Umami walks the chain
      # right to left, so a client's own entry never becomes the visitor. Hosts that arrive with
      # cf-connecting-ip or the Netlify header are unaffected: those are single values.
      TRUSTED_PROXIES: private,loopback
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`umami.${DOMAIN}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.umami.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.umami.loadbalancer.healthcheck.path=/api/heartbeat"
      - "traefik.http.services.umami.loadbalancer.healthcheck.interval=5s"
      # Same-origin tracker for the Free Planning Poker beta host (docs/umami-integration.md): the
      # script and its collect endpoint under /api/u, stripped to Umami's own p.js and /api/p so
      # the global names above keep serving every other site. The script posts to its own
      # directory + /api/p, hence /api/u/api/p. Exactly these two paths, never a /api/u prefix:
      # that would put Umami's whole API (login included) on the beta origin. Priority above the
      # fpp-api router of the host (Host rule only, priority = its length).
      - "traefik.http.routers.umami-fpp.rule=Host(`next.free-planning-poker.com`) && (Path(`/api/u/p.js`) || Path(`/api/u/api/p`))"
      - "traefik.http.routers.umami-fpp.priority=1000"
      - "traefik.http.routers.umami-fpp.entrypoints=websecure"
      - "traefik.http.routers.umami-fpp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami-fpp.service=umami"
      - "traefik.http.routers.umami-fpp.middlewares=umami-fpp-clientip,umami-fpp-strip,rate-limit@file,security-headers@file"
      - "traefik.http.middlewares.umami-fpp-strip.stripprefix.prefixes=/api/u"
      # Umami reads CLIENT_IP_HEADER (the Netlify header, for sy-serendipity) first, then true-client-ip,
      # then cf-connecting-ip. A browser can write the first two; Cloudflare overwrites the third at
      # its edge. Dropping the two here leaves cf-connecting-ip as the visitor (empty value = remove).
      - "traefik.http.middlewares.umami-fpp-clientip.headers.customrequestheaders.X-Nf-Client-Connection-Ip="
      - "traefik.http.middlewares.umami-fpp-clientip.headers.customrequestheaders.True-Client-Ip="
    networks:
      - proxy
      - postgres-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
