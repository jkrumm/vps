---
# Networking/proxy stack — cloudflared, Traefik, socket-proxy, RollHook
# Deploy: op run --env-file=.env.tpl -- docker compose -f compose.networking.yml up -d

networks:
  proxy:
    external: true
  monitoring-net:
    external: true
  # weatherorb-account <-> Traefik only (the account's tailnet-only worker door); the account is
  # not on `proxy`. Created by scripts/setup.sh. On a running server `docker network connect
  # weatherorb-account traefik` applies it without recreating Traefik.
  weatherorb-account:
    external: true
  socket-proxy-net:
    driver: bridge
    internal: true
  socket-proxy-rollhook-net:
    driver: bridge
    internal: true

volumes:
  rollhook-data:

services:

  # ---------------------------------------------------------------------------
  # Docker socket proxy — restricts Docker API access to read-only operations.
  # Traefik connects here instead of mounting docker.sock directly.
  # ---------------------------------------------------------------------------
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      IMAGES: 1
      INFO: 1
      # Deny write operations
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — all public ingress flows through here.
  # No ports exposed to the internet; cloudflared makes outbound connections
  # to Cloudflare edge only. Configure public hostnames in Cloudflare dashboard:
  #   *.DOMAIN → https://traefik:443  (TLS verify: disabled — internal cert)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Traefik v3 — reverse proxy + HTTPS via Cloudflare DNS-01 wildcard cert.
  # No ports exposed — cloudflared routes traffic to traefik:443 internally.
  # Entrypoints: web (:80, redirect to websecure) + websecure (:443, TLS).
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    ports:
      # Bind websecure entrypoint to Tailscale interface only — dashboard access without Cloudflare.
      # Public apps are still routed via cloudflared (no internet exposure here).
      - "${VPS_TAILSCALE_IP}:443:443"
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}  # lego expects CF_DNS_API_TOKEN for Cloudflare DNS-01
      # ACME email: passed as env var because traefik.yml doesn't support ${VAR} substitution
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
      # Traefik talks to ClickStack on the unauthed :4319 receiver (added in
      # clickstack/otel-custom.yaml, bound to docker bridge only).
      # No HYPERDX_API_KEY needed here.
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
    networks:
      - proxy
      - socket-proxy-net
      - monitoring-net   # reach clickstack:4318 for OTLP traces + metrics
      - weatherorb-account   # the account's worker door
    labels:
      # Traefik dashboard — Tailscale-only via DNS (A record → Tailscale IP, DNS-only/grey cloud).
      # Docker NAT rewrites source IPs, so ipAllowList is ineffective here.
      # CGNAT routing (100.x.x.x) is unreachable from public internet — DNS is the access control.
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Request wildcard certs via DNS-01 — Docker Compose substitutes ${DOMAIN} in labels ✓
      # Two wildcards: jkrumm.com (primary stack) + free-planning-poker.com (FPP public endpoints).
      # Both zones live in the same CF account and the API token has DNS:Edit across them.
      - "traefik.http.routers.dashboard.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=*.${DOMAIN}"
      - "traefik.http.routers.dashboard.tls.domains[1].main=free-planning-poker.com"
      - "traefik.http.routers.dashboard.tls.domains[1].sans=*.free-planning-poker.com"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Socket proxy for RollHook — write access (POST=1) for rolling deployments.
  # Isolated on socket-proxy-rollhook-net, never shared with Traefik's proxy.
  # ---------------------------------------------------------------------------
  socket-proxy-rollhook:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy-rollhook
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      IMAGES: 1
      INFO: 1
      POST: 1
      # docker compose up --scale needs to inspect/attach named volumes (e.g. the
      # fpp-analytics-data volume mounted by fpp-analytics). Without this the
      # rollout step fails with "Request forbidden by administrative rules".
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-rollhook-net
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # RollHook — zero-downtime rolling deployments via GitHub Actions webhooks.
  # Receives POST /deploy/:app, scales up new container, waits for healthcheck,
  # then removes the old one. Routed publicly via Cloudflare → Traefik.
  #
  # Stateless: discovers compose_path + service from running container labels.
  # App compose dirs must be mounted so docker-rollout can read them.
  # Add one volume per app:  - /home/jkrumm/<app>:/home/jkrumm/<app>:ro
  # ---------------------------------------------------------------------------
  rollhook:
    image: ghcr.io/jkrumm/rollhook:latest
    container_name: rollhook
    restart: unless-stopped
    depends_on:
      - socket-proxy-rollhook
    security_opt:
      - no-new-privileges:true
    environment:
      ROLLHOOK_SECRET: ${ROLLHOOK_SECRET}
      ROLLHOOK_URL: https://rollhook.jkrumm.com
      PORT: "7700"
      DOCKER_HOST: tcp://socket-proxy-rollhook:2375
      # Deploy notifications — posts to the same #updates channel Watchtower uses,
      # but via the plain https webhook (WEBHOOK_UPDATES), not Watchtower's
      # shoutrrr slack:// URL. RollHook POSTs raw JSON. See rollhook#15.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_UPDATES}
      # OTLP logs export to ClickStack via the unauthed :4319 receiver bound
      # to the docker bridge (see clickstack/otel-custom.yaml + the Traefik
      # precedent above). Surfaces deploys as queryable markers in HyperDX
      # with service.name=rollhook.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      DEPLOY_ENVIRONMENT: prod
    volumes:
      - rollhook-data:/app/data
      # Mount all app compose dirs — RollHook reads compose.yml from inside the container
      - /home/jkrumm/vps/apps:/home/jkrumm/vps/apps

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rollhook.rule=Host(`rollhook.${DOMAIN}`)"
      - "traefik.http.routers.rollhook.entrypoints=websecure"
      - "traefik.http.routers.rollhook.tls.certresolver=letsencrypt"
      - "traefik.http.services.rollhook.loadbalancer.server.port=7700"
      - "traefik.http.routers.rollhook.middlewares=rate-limit@file,security-headers@file"
    networks:
      - proxy
      - socket-proxy-rollhook-net
      - monitoring-net   # reach clickstack:4319 for OTLP deploy markers
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
