name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python for the compose lint (PyYAML) and its tests.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # shellcheck ships on ubuntu-latest; `make check` needs no secrets or op
      # The compose lint parses YAML directly (no Docker); the Makefile picks up this PyYAML.
      - run: python3 -m pip install pyyaml
      - run: make check
