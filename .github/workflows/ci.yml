name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker compose and shellcheck ship on ubuntu-latest; `make check` needs no secrets or op
      - run: make check
