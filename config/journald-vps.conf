# Cap the journal (installed as /etc/systemd/journald.conf.d/vps.conf by setup.sh /
# `make journald-install`). The default cap is 10% of the filesystem (~17 GB here); the
# journal reached 2.6 GB over eight months (measured 2026-11-17, issue_2033) with nothing
# bounding it. 1 GB keeps ~3 months, which covers the fail2ban (MariaDB auth) and container
# log reads; Dozzle and ClickStack hold the longer history.
[Journal]
SystemMaxUse=1G
