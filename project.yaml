# How the factory ships this project (software-factory docs/project.md).
apiVersion: factory/v2
name: vps
deploy:
  mode: make # `make deploy` pulls this repo on the VPS and applies the affected apps/stacks; `make verify` probes them
  targets:
    - { name: vps, host: vps, verify: make verify }
  hold: 5m
ship:
  - { via: push }
# One lead: the VPS is one host with one checkout that `make deploy` applies in place, and the shared infra stacks change under every app.
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
