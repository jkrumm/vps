# Slim OpenTelemetry Collector for host monitoring, built with ocb (the OpenTelemetry Collector Builder).
# Measured 2026-11-17 (collector 0.165.0, host metrics at 30 s, idle): contrib distribution 359 MB binary / 180 MB RSS,
# core distribution 171 MB / 79 MB, this manifest 45 MB / 40 MB. Every module is pinned to the same release; bump
# them together (the version below, the module versions, OCB_VERSION in the Dockerfile and build.sh).
dist:
  name: host-agent
  description: Host, container and reachability metrics agent
  output_path: ./_build
  version: 0.165.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/httpcheckreceiver v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/icmpcheckreceiver v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.165.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.165.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.165.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.165.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.165.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.165.0
